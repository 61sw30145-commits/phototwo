<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimal Photo Booth</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style id="dynamic-print-style">
    @media print {
      @page {
        size: 80mm auto;
        margin: 0;
      }
      html, body {
        margin: 0 !important;
        padding: 0 !important;
        background: #fff !important;
        width: 100% !important;
      }
      body * { visibility: hidden; }
      #print-area, #print-area * { visibility: visible; }
      #print-area {
        position: absolute;
        left: 0;
        top: 0;
        width: 72mm !important;
        margin: 0 auto;
        display: block;
      }
      #final-canvas {
        width: 100% !important;
        height: auto !important;
        display: block;
        margin: 0 auto;
      }
      #back-button-container, .bg-white { display: none !important; }
    }
  </style>
</head>
<body class="bg-stone-50 text-stone-800 font-sans min-h-screen flex flex-col items-center justify-center p-4 relative">

  <!-- ปุ่มย้อนกลับ -->
  <div id="back-button-container" class="absolute top-6 left-6 hidden">
    <button onclick="goBack()" class="flex items-center gap-2 px-4 py-2 bg-white border border-stone-200 rounded-full shadow-sm hover:border-stone-800 transition text-sm font-medium text-stone-700">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
      </svg>
      ย้อนกลับ
    </button>
  </div>

  <!-- Step 1: หน้าแรก -->
  <div id="step-1" class="text-center space-y-6">
    <h1 class="text-4xl font-light tracking-wide">PHOTO BOOTH</h1>
    <button onclick="goToStep(15)" class="px-8 py-3 bg-stone-800 text-white rounded-full hover:bg-stone-700 transition">กดเพื่อเริ่มเลือกรูป</button>
  </div>

  <!-- Step 1.5: เลือกจำนวนช็อต -->
  <div id="step-15" class="hidden text-center space-y-6 w-full max-w-md">
    <h2 class="text-2xl font-light">เลือกจำนวนช็อต</h2>
    <div class="grid grid-cols-2 gap-4">
      <button onclick="selectShotCount(1)" class="p-6 bg-white border border-stone-200 rounded-2xl shadow-sm hover:border-stone-800 transition flex flex-col items-center gap-2 group">
        <span class="text-3xl font-light group-hover:scale-110 transition">1</span>
        <span class="text-sm font-medium text-stone-600">เลือก 1 รูป (80x130 mm)</span>
      </button>
      <button onclick="selectShotCount(3)" class="p-6 bg-white border border-stone-200 rounded-2xl shadow-sm hover:border-stone-800 transition flex flex-col items-center gap-2 group">
        <span class="text-3xl font-light group-hover:scale-110 transition">3</span>
        <span class="text-sm font-medium text-stone-600">เลือก 3 รูป (80x213 mm)</span>
      </button>
    </div>
  </div>

  <!-- Step 2: เลือกกรอบรูป -->
  <div id="step-2" class="hidden text-center space-y-6 w-full max-w-lg">
    <h2 class="text-2xl font-light">เลือกกรอบรูป</h2>
    <div id="frame-list" class="grid grid-cols-2 gap-4 max-h-[70vh] overflow-y-auto p-2"></div>
  </div>

  <!-- Step 3: อัปโหลดรูปภาพ -->
  <div id="step-3" class="hidden text-center space-y-6 w-full max-w-md">
    <h2 class="text-2xl font-light">อัปโหลดรูปภาพของคุณ</h2>
    
    <div id="upload-inputs" class="space-y-4"></div>

    <button id="confirm-images-btn" onclick="goToStep(4)" class="w-full py-3 bg-stone-800 text-white rounded-full hover:bg-stone-700 transition hidden">
      ยืนยันรูปภาพ
    </button>
  </div>

  <!-- Step 4: สั่งปริ้นท์ -->
  <div id="step-4" class="hidden text-center space-y-6 w-full max-w-md">
    <h2 class="text-2xl font-light">พิมพ์รูปภาพ / บันทึกไฟล์</h2>
    
    <div id="print-area" class="flex justify-center">
      <canvas id="final-canvas" class="max-w-full rounded shadow-md border border-stone-200"></canvas>
    </div>

    <div class="bg-white p-4 rounded-xl border border-stone-200 space-y-3">
      <div class="flex items-center justify-between text-sm">
        <label for="print-copies" class="font-medium text-stone-700">จำนวนที่ต้องการพิมพ์:</label>
        <div class="flex items-center border border-stone-300 rounded-lg overflow-hidden">
          <button onclick="adjustCopies(-1)" class="px-3 py-1 bg-stone-100 hover:bg-stone-200 text-stone-700">-</button>
          <input type="number" id="print-copies" value="1" min="1" max="10" class="w-12 text-center py-1 focus:outline-none text-stone-800 font-medium">
          <button onclick="adjustCopies(1)" class="px-3 py-1 bg-stone-100 hover:bg-stone-200 text-stone-700">+</button>
        </div>
      </div>

      <div class="flex flex-col gap-2 pt-2 border-t border-stone-100">
        <button onclick="triggerPrint()" class="w-full py-2.5 bg-stone-800 text-white rounded-xl hover:bg-stone-700 transition font-medium flex items-center justify-center gap-2">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z" />
          </svg>
          สั่งปริ้นท์ (ระบบปกติ)
        </button>

        <button onclick="printDirectSerial()" class="w-full py-2 bg-stone-100 text-stone-700 hover:bg-stone-200 rounded-xl transition text-xs font-medium border border-stone-200">
          🔌 เลือกเครื่องพิมพ์โดยตรง (USB/Serial Thermal Printer)
        </button>

        <button onclick="downloadImage()" class="w-full py-2 bg-white text-stone-800 border border-stone-300 hover:bg-stone-50 rounded-xl transition font-medium text-sm flex items-center justify-center gap-2">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
          </svg>
          บันทึกรูปภาพลงเครื่อง (.jpg)
        </button>
      </div>
    </div>

    <button onclick="goToStep(3)" class="text-sm text-stone-500 hover:text-stone-800 underline">เปลี่ยนรูปภาพ</button>
  </div>

  <script>
    let currentStep = 1;
    let stepHistory = [1];
    let selectedFrame = null;
    let targetShotCount = 3;
    let capturedImages = [];
    let frames = [];
    let serialPort = null;

    async function loadConfig() {
      try {
        const res = await fetch('config.json');
        const config = await res.json();
        frames = config.frames || [];
      } catch (e) {
        frames = [
          { id: 1, name: "โปร่งใส (1 รูป)", file: "frame_1shot_1.png", shots: 1 },
          { id: 2, name: "หนังสือพิมพ์ (1 รูป)", file: "frame_1shot_2.png", shots: 1 },
          { id: 3, name: "โปร่งใส (3 รูป)", file: "frame1.png", shots: 3 },
          { id: 4, name: "ใบเสร็จ (3 รูป)", file: "frame2.png", shots: 3 },
          { id: 5, name: "บัวหลวงใหญ่ (3 รูป)", file: "frame3.png", shots: 3 }
        ];
      }
    }
    loadConfig();

    function updatePagePrintStyle() {
      const styleEl = document.getElementById('dynamic-print-style');
      styleEl.innerHTML = `
        @media print {
          @page {
            size: 80mm auto;
            margin: 0;
          }
          html, body {
            margin: 0 !important;
            padding: 0 !important;
            background: #fff !important;
            width: 100% !important;
          }
          body * { visibility: hidden; }
          #print-area, #print-area * { visibility: visible; }
          #print-area {
            position: absolute;
            left: 0;
            top: 0;
            width: 72mm !important;
            margin: 0 auto;
            display: block;
          }
          #final-canvas {
            width: 100% !important;
            height: auto !important;
            display: block;
            margin: 0 auto;
          }
          #back-button-container, .bg-white { display: none !important; }
        }
      `;
    }

    function selectShotCount(count) {
      targetShotCount = count;
      capturedImages = new Array(count).fill(null);
      updatePagePrintStyle();
      goToStep(2);
    }

    function goToStep(step, isBack = false) {
      document.querySelectorAll('[id^="step-"]').forEach(el => el.classList.add('hidden'));
      document.getElementById(`step-${step}`).classList.remove('hidden');

      if (!isBack && currentStep !== step) {
        stepHistory.push(step);
      }
      currentStep = step;

      const backBtn = document.getElementById('back-button-container');
      if (step === 1) {
        backBtn.classList.add('hidden');
      } else {
        backBtn.classList.remove('hidden');
      }

      if (step === 2) renderFrames();
      if (step === 3) renderUploadInputs();
      if (step === 4) renderFinalCanvas();
    }

    function goBack() {
      if (stepHistory.length > 1) {
        stepHistory.pop();
        const prevStep = stepHistory[stepHistory.length - 1];
        goToStep(prevStep, true);
      }
    }

    function renderFrames() {
      const container = document.getElementById('frame-list');
      const filteredFrames = frames.filter(f => f.shots === targetShotCount);

      if (filteredFrames.length === 0) {
        container.innerHTML = `<p class="col-span-2 text-stone-500 py-8">ไม่พบกรอบรูปสำหรับ ${targetShotCount} ช็อต</p>`;
        return;
      }

      const aspectClass = targetShotCount === 1 ? 'aspect-[80/130]' : 'aspect-[80/213]';

      container.innerHTML = filteredFrames.map(f => `
        <div onclick="selectFrame('${f.file}')" class="group border border-stone-200 p-3 rounded-xl cursor-pointer hover:border-stone-800 bg-white shadow-sm hover:shadow-md transition flex flex-col items-center space-y-2">
          <div class="w-full ${aspectClass} bg-stone-100 rounded-lg overflow-hidden flex items-center justify-center p-1 border border-stone-100 relative">
            <img src="${f.file}" alt="${f.name}" class="w-full h-full object-contain group-hover:scale-105 transition duration-200 z-10" onerror="this.src='https://via.placeholder.com/150?text=No+Preview'">
          </div>
          <p class="text-sm font-medium text-stone-700 group-hover:text-stone-900">${f.name}</p>
        </div>
      `).join('');
    }

    function selectFrame(file) {
      selectedFrame = file;
      goToStep(3);
    }

    function renderUploadInputs() {
      const container = document.getElementById('upload-inputs');
      container.innerHTML = '';

      for (let i = 0; i < targetShotCount; i++) {
        const inputWrapper = document.createElement('div');
        inputWrapper.className = "flex flex-col items-center gap-2 p-4 bg-white border border-stone-200 rounded-xl shadow-sm";
        inputWrapper.innerHTML = `
          <label class="text-sm font-medium text-stone-700">รูปที่ ${i + 1}</label>
          <input type="file" accept="image/*" onchange="handleImageUpload(event, ${i})" class="text-sm text-stone-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-stone-100 file:text-stone-700 hover:file:bg-stone-200 cursor-pointer">
          <div id="preview-container-${i}" class="mt-2 hidden">
            <img id="upload-preview-${i}" class="w-32 h-24 object-cover rounded border border-stone-200">
          </div>
        `;
        container.appendChild(inputWrapper);
      }
      checkUploadStatus();
    }

    function handleImageUpload(event, index) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          capturedImages[index] = e.target.result;
          const imgEl = document.getElementById(`upload-preview-${index}`);
          imgEl.src = e.target.result;
          document.getElementById(`preview-container-${index}`).classList.remove('hidden');
          checkUploadStatus();
        };
        reader.readAsDataURL(file);
      }
    }

    function checkUploadStatus() {
      const allUploaded = capturedImages.length === targetShotCount && capturedImages.every(img => img !== null);
      const btn = document.getElementById('confirm-images-btn');
      if (allUploaded) {
        btn.classList.remove('hidden');
      } else {
        btn.classList.add('hidden');
      }
    }

    function loadImage(src) {
      return new Promise((resolve, reject) => {
        if (!src) return resolve(null);
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = src;
      });
    }

    async function renderFinalCanvas() {
      const canvas = document.getElementById('final-canvas');
      const ctx = canvas.getContext('2d');

      if (targetShotCount === 1) {
        canvas.width = 576;
        canvas.height = 936;

        ctx.fillStyle = "#FFFFFF";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        try {
          const shotImages = await Promise.all(capturedImages.map(imgSrc => loadImage(imgSrc)));
          
          if (shotImages[0]) {
            const photoW = 504;
            const photoH = 648;
            const photoX = 36;
            const photoY = 72;

            ctx.drawImage(shotImages[0], photoX, photoY, photoW, photoH);
          }

          if (selectedFrame) {
            const frameImg = await loadImage(selectedFrame);
            if (frameImg) ctx.drawImage(frameImg, 0, 0, canvas.width, canvas.height);
          }
        } catch (err) {
          console.error("เกิดข้อผิดพลาดในการสร้าง Canvas สำหรับ 1 ช็อต", err);
        }

      } else {
        canvas.width = 576;
        canvas.height = 1533;

        ctx.fillStyle = "#FFFFFF";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        try {
          const shotImages = await Promise.all(capturedImages.map(imgSrc => loadImage(imgSrc)));
          
          shotImages.forEach((img, i) => {
            if (img) ctx.drawImage(img, 36, 72 + (i * 432), 504, 396);
          });

          if (selectedFrame) {
            const frameImg = await loadImage(selectedFrame);
            if (frameImg) ctx.drawImage(frameImg, 0, 0, canvas.width, canvas.height);
          }
        } catch (err) {
          console.error("เกิดข้อผิดพลาดในการสร้าง Canvas สำหรับ 3 ช็อต", err);
        }
      }
    }

    function adjustCopies(delta) {
      const input = document.getElementById('print-copies');
      let val = parseInt(input.value) || 1;
      val = Math.max(1, Math.min(10, val + delta));
      input.value = val;
    }

    function triggerPrint() {
      const copies = parseInt(document.getElementById('print-copies').value) || 1;
      for (let i = 0; i < copies; i++) {
        window.print();
      }
    }

    async function downloadImage() {
      const canvas = document.getElementById('final-canvas');
      const dataUrl = canvas.toDataURL('image/jpeg', 0.95);

      try {
        const response = await fetch(dataUrl);
        const blob = await response.blob();
        const file = new File([blob], `photobooth-${Date.now()}.jpg`, { type: 'image/jpeg' });

        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({
            files: [file],
            title: 'Photo Booth',
            text: 'รูปถ่ายจาก Photo Booth'
          });
        } else {
          const link = document.createElement('a');
          link.download = `photobooth-${Date.now()}.jpg`;
          link.href = dataUrl;
          link.click();
        }
      } catch (err) {
        console.error('Save image failed:', err);
      }
    }

    async function printDirectSerial() {
      if (!('serial' in navigator)) {
        alert("เบราว์เซอร์นี้ไม่รองรับ Web Serial API กรุณาใช้ Chrome หรือ Edge เวอร์ชันใหม่");
        return;
      }

      try {
        if (!serialPort) {
          serialPort = await navigator.serial.requestPort();
        }
        await serialPort.open({ baudRate: 115200 });

        const writer = serialPort.writable.getWriter();
        const copies = parseInt(document.getElementById('print-copies').value) || 1;

        for (let c = 0; c < copies; c++) {
          await writer.write(new Uint8Array([0x1B, 0x40]));
          await writer.write(new Uint8Array([0x1D, 0x56, 0x42, 0x00])); 
        }

        writer.releaseLock();
        alert("ส่งคำสั่งพิมพ์ไปยังเครื่องพิมพ์เรียบร้อยแล้ว");
      } catch (err) {
        console.error("เกิดข้อผิดพลาดในการสั่งพิมพ์แบบ Direct Serial:", err);
        alert("ไม่สามารถสั่งพิมพ์โดยตรงได้: " + err.message);
      }
    }
  </script>
</body>
</html>
