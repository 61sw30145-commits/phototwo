<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Photo Booth Xprinter</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#f5f5f4;
    color:#292524;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

button{
    cursor:pointer;
}

.hidden{
    display:none !important;
}

.container{
    width:100%;
    max-width:900px;
    margin:auto;
    padding:25px;
}

.card{
    background:white;
    border-radius:18px;
    padding:20px;
    box-shadow:0 4px 20px rgba(0,0,0,.06);
}

h1,h2{
    font-weight:400;
}

.btn{
    border:0;
    border-radius:12px;
    padding:13px 20px;
    font-size:15px;
}

.btn-dark{
    background:#292524;
    color:white;
}

.btn-light{
    background:#f5f5f4;
    color:#292524;
    border:1px solid #ddd;
}

.btn-danger{
    background:#dc2626;
    color:white;
}

.grid{
    display:grid;
    gap:15px;
}

.grid-2{
    grid-template-columns:repeat(2,1fr);
}

.center{
    text-align:center;
}

#webcam{
    width:100%;
    display:block;
    transform:scaleX(-1);
}

.camera-box{
    background:#000;
    border-radius:15px;
    overflow:hidden;
    position:relative;
}

.countdown{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    background:rgba(0,0,0,.35);
    font-size:90px;
    font-weight:bold;
}

.shots{
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
}

.shot{
    width:110px;
    height:80px;
    object-fit:cover;
    border-radius:8px;
    border:2px solid #ddd;
}

.frame-item{
    border:2px solid #e7e5e4;
    padding:10px;
    border-radius:14px;
    background:white;
}

.frame-item:hover{
    border-color:#292524;
}

.frame-preview{
    width:100%;
    aspect-ratio:70/210;
    object-fit:contain;
    background:#fafafa;
}

.preview-wrap{
    background:#ddd;
    padding:20px;
    border-radius:15px;
    display:flex;
    justify-content:center;
}

#final-preview{
    max-width:100%;
    max-height:75vh;
    box-shadow:0 4px 15px rgba(0,0,0,.2);
}

.controls{
    display:grid;
    gap:15px;
}

.control{
    display:grid;
    grid-template-columns:140px 1fr 55px;
    gap:10px;
    align-items:center;
}

input[type=range]{
    width:100%;
}

.value{
    text-align:right;
    font-weight:bold;
}

select,
input[type=number]{
    padding:8px;
    border:1px solid #ddd;
    border-radius:8px;
}

.status{
    padding:10px;
    background:#fafaf9;
    border-radius:10px;
    font-size:13px;
    color:#57534e;
}

@media(max-width:600px){

    .container{
        padding:12px;
    }

    .grid-2{
        grid-template-columns:1fr;
    }

    .control{
        grid-template-columns:100px 1fr 45px;
    }
}


/* ================================
   PRINT
================================ */

@media print{

    @page{
        size:80mm 210mm;
        margin:0;
    }

    html,
    body{
        margin:0 !important;
        padding:0 !important;
        background:white !important;
    }

    body *{
        visibility:hidden !important;
    }

    #print-page,
    #print-page *{
        visibility:visible !important;
    }

    #print-page{
        position:absolute;
        left:0;
        top:0;
        margin:0;
        padding:0;
        background:white;
        width:80mm;
    }

    #print-image{
        display:block;
        width:100%;
        height:auto;
        margin:0;
        padding:0;
    }
}

</style>
</head>

<body>

<div class="container">

    <!-- =========================
         STEP 1
    ========================== -->

    <section id="step1" class="card center">

        <h1>PHOTO BOOTH</h1>

        <p>
            Xprinter Thermal Photo Booth
        </p>

        <button
            class="btn btn-dark"
            onclick="showStep(1.5)">
            เริ่มถ่ายรูป
        </button>

    </section>


    <!-- =========================
         STEP 1.5
    ========================== -->

    <section id="step15" class="card center hidden">

        <h2>เลือกจำนวนรูป</h2>

        <div class="grid grid-2">

            <button
                class="btn btn-light"
                onclick="selectShotCount(1)">

                <b style="font-size:35px">1</b>

                <br>

                1 ช็อต
                <br>
                80 × 130 mm

            </button>


            <button
                class="btn btn-light"
                onclick="selectShotCount(3)">

                <b style="font-size:35px">3</b>

                <br>

                3 ช็อต
                <br>
                70 × 210 mm

            </button>

        </div>

    </section>


    <!-- =========================
         STEP 2 FRAME
    ========================== -->

    <section id="step2" class="card hidden">

        <h2 class="center">
            เลือกกรอบรูป
        </h2>

        <div id="frame-list"
             class="grid grid-2">
        </div>

    </section>


    <!-- =========================
         STEP 3 CAMERA
    ========================== -->

    <section id="step3" class="card hidden">

        <h2 class="center">
            ถ่ายรูป
        </h2>

        <div class="camera-box">

            <video
                id="webcam"
                autoplay
                playsinline>
            </video>

            <div
                id="countdown"
                class="countdown hidden">
                3
            </div>

        </div>

        <br>

        <div
            id="shots"
            class="shots">
        </div>

        <br>

        <div class="center">

            <button
                class="btn btn-dark"
                onclick="confirmPhotos()">

                ยืนยันรูป

            </button>

        </div>

    </section>


    <!-- =========================
         STEP 4 EDIT
    ========================== -->

    <section id="step4" class="card hidden">

        <h2 class="center">
            ปรับภาพก่อนพิมพ์
        </h2>

        <div class="preview-wrap">

            <canvas
                id="final-preview">
            </canvas>

        </div>

        <br>

        <div class="controls">

            <!-- Brightness -->

            <div class="control">

                <label>
                    Brightness
                </label>

                <input
                    id="brightness"
                    type="range"
                    min="-50"
                    max="80"
                    value="30"
                    oninput="updatePreview()">

                <span
                    id="brightnessValue"
                    class="value">
                    30
                </span>

            </div>


            <!-- Contrast -->

            <div class="control">

                <label>
                    Contrast
                </label>

                <input
                    id="contrast"
                    type="range"
                    min="40"
                    max="120"
                    value="70"
                    oninput="updatePreview()">

                <span
                    id="contrastValue"
                    class="value">
                    0.70
                </span>

            </div>


            <!-- Gamma -->

            <div class="control">

                <label>
                    Gamma
                </label>

                <input
                    id="gamma"
                    type="range"
                    min="70"
                    max="180"
                    value="120"
                    oninput="updatePreview()">

                <span
                    id="gammaValue"
                    class="value">
                    1.20
                </span>

            </div>


            <!-- Shadow -->

            <div class="control">

                <label>
                    Shadow
                </label>

                <input
                    id="shadow"
                    type="range"
                    min="0"
                    max="50"
                    value="10"
                    oninput="updatePreview()">

                <span
                    id="shadowValue"
                    class="value">
                    10
                </span>

            </div>


            <!-- Highlight -->

            <div class="control">

                <label>
                    Highlight
                </label>

                <input
                    id="highlight"
                    type="range"
                    min="0"
                    max="50"
                    value="10"
                    oninput="updatePreview()">

                <span
                    id="highlightValue"
                    class="value">
                    10
                </span>

            </div>


            <!-- Dither -->

            <div class="control">

                <label>
                    Dithering
                </label>

                <select
                    id="dither"
                    onchange="updatePreview()">

                    <option value="floyd">
                        Floyd-Steinberg
                    </option>

                    <option value="ordered">
                        Ordered 4×4
                    </option>

                    <option value="none">
                        None
                    </option>

                </select>

                <span></span>

            </div>


            <!-- Copies -->

            <div class="control">

                <label>
                    จำนวน
                </label>

                <input
                    id="copies"
                    type="number"
                    min="1"
                    max="10"
                    value="1">

                <span></span>

            </div>

        </div>

        <br>

        <div class="status">

            ค่าที่แนะนำสำหรับเครื่องของคุณ:
            Brightness +30 /
            Contrast 0.70 /
            Gamma 1.20 /
            Floyd-Steinberg

        </div>

        <br>

        <div class="grid grid-2">

            <button
                class="btn btn-dark"
                onclick="printWithMac()">

                🖨 พิมพ์ผ่าน Mac

            </button>

            <button
                class="btn btn-light"
                onclick="downloadImage()">

                ดาวน์โหลด JPG

            </button>

        </div>

        <br>

        <button
            class="btn btn-light"
            style="width:100%"
            onclick="printDirectSerial()">

            🔌 Direct ESC/POS
            (เฉพาะกรณีที่ USB ถูกมองเป็น Serial)

        </button>

        <br><br>

        <button
            class="btn btn-light"
            style="width:100%"
            onclick="showStep(3)">

            ← กลับไปถ่ายใหม่

        </button>

    </section>


    <!-- =========================
         PRINT PAGE
    ========================== -->

    <div id="print-page" class="hidden">

        <img
            id="print-image">

    </div>

</div>


<script>

/* =========================================================
   CONFIG
========================================================= */

let targetShotCount = 3;

let selectedFrame = null;

let frames = [];

let capturedImages = [];

let mediaStream = null;

let currentShot = 0;

let countdownTimer = null;


/*
    XP-N160II
    203 DPI
    8 dots/mm

    72mm printable area
    = 576 dots
*/

const PRINTER_DOTS = 576;


/* =========================================================
   LOAD CONFIG
========================================================= */

async function loadConfig(){

    try{

        const response =
            await fetch("config.json");

        const config =
            await response.json();

        frames =
            config.frames || [];

    }catch(error){

        console.log(
            "ไม่พบ config.json"
        );

        frames = [

            {
                id:1,
                name:"โปร่งใส 1 รูป",
                file:"frame_1shot_1.png",
                shots:1
            },

            {
                id:2,
                name:"หนังสือพิมพ์ 1 รูป",
                file:"frame_1shot_2.png",
                shots:1
            },

            {
                id:3,
                name:"โปร่งใส 3 รูป",
                file:"frame1.png",
                shots:3
            },

            {
                id:4,
                name:"ใบเสร็จ 3 รูป",
                file:"frame2.png",
                shots:3
            },

            {
                id:5,
                name:"บัวหลวง 3 รูป",
                file:"frame3.png",
                shots:3
            },

            {
                id:6,
                name:"ดาร์ก 3 รูป",
                file:"frame4.png",
                shots:3
            }

        ];

    }

}


/* =========================================================
   STEP
========================================================= */

function showStep(step){

    document
        .querySelectorAll("section")
        .forEach(el =>
            el.classList.add("hidden")
        );

    if(step === 1.5){

        document
            .getElementById("step15")
            .classList.remove("hidden");

    }
    else{

        document
            .getElementById("step" + step)
            .classList.remove("hidden");

    }

}


/* =========================================================
   SHOT COUNT
========================================================= */

function selectShotCount(count){

    targetShotCount = count;

    capturedImages =
        new Array(count).fill(null);

    renderFrames();

    showStep(2);

}


/* =========================================================
   FRAMES
========================================================= */

function renderFrames(){

    const container =
        document.getElementById(
            "frame-list"
        );

    const list =
        frames.filter(
            f => f.shots === targetShotCount
        );

    container.innerHTML = "";

    list.forEach(frame => {

        const div =
            document.createElement("div");

        div.className =
            "frame-item";

        div.innerHTML = `

            <img
                class="frame-preview"
                src="${frame.file}">

            <br>

            <div class="center">
                <b>${frame.name}</b>
            </div>

        `;

        div.onclick = () => {

            selectedFrame =
                frame.file;

            startCamera();

        };

        container.appendChild(div);

    });

}


/* =========================================================
   CAMERA
========================================================= */

async function startCamera(){

    showStep(3);

    try{

        mediaStream =
            await navigator.mediaDevices
                .getUserMedia({

                    video:{
                        width:{
                            ideal:1920
                        },
                        height:{
                            ideal:1080
                        }
                    },

                    audio:false

                });

        const video =
            document.getElementById(
                "webcam"
            );

        video.srcObject =
            mediaStream;

        capturedImages =
            new Array(
                targetShotCount
            ).fill(null);

        currentShot = 0;

        setTimeout(
            startNextShot,
            1000
        );

    }catch(error){

        alert(
            "ไม่สามารถเปิดกล้องได้\n\n" +
            error.message
        );

    }

}


/* =========================================================
   COUNTDOWN
========================================================= */

function startNextShot(){

    if(
        currentShot >=
        targetShotCount
    ){

        renderShotPreview();

        return;

    }

    let number = 3;

    const countdown =
        document.getElementById(
            "countdown"
        );

    countdown.classList.remove(
        "hidden"
    );

    countdown.innerText =
        number;

    countdownTimer =
        setInterval(() => {

            number--;

            if(number > 0){

                countdown.innerText =
                    number;

            }else{

                clearInterval(
                    countdownTimer
                );

                countdown.classList.add(
                    "hidden"
                );

                takePhoto(
                    currentShot
                );

                currentShot++;

                setTimeout(
                    startNextShot,
                    1500
                );

            }

        },1000);

}


/* =========================================================
   TAKE PHOTO
========================================================= */

function takePhoto(index){

    const video =
        document.getElementById(
            "webcam"
        );

    const canvas =
        document.createElement(
            "canvas"
        );

    const vw =
        video.videoWidth;

    const vh =
        video.videoHeight;


    if(targetShotCount === 1){

        canvas.width = 1050;
        canvas.height = 1350;

        cropVideo(
            video,
            canvas,
            1050 / 1350
        );

    }else{

        canvas.width = 900;
        canvas.height = 675;

        cropVideo(
            video,
            canvas,
            900 / 675
        );

    }


    capturedImages[index] =
        canvas.toDataURL(
            "image/jpeg",
            0.95
        );

}


/* =========================================================
   CROP VIDEO
========================================================= */

function cropVideo(
    video,
    canvas,
    ratio
){

    const vw =
        video.videoWidth;

    const vh =
        video.videoHeight;

    const videoRatio =
        vw / vh;

    let sx,
        sy,
        sw,
        sh;

    if(videoRatio > ratio){

        sh = vh;

        sw = vh * ratio;

        sx =
            (vw - sw) / 2;

        sy = 0;

    }else{

        sw = vw;

        sh = vw / ratio;

        sx = 0;

        sy =
            (vh - sh) / 2;

    }


    const ctx =
        canvas.getContext("2d");

    /*
        Mirror image
    */

    ctx.translate(
        canvas.width,
        0
    );

    ctx.scale(
        -1,
        1
    );

    ctx.drawImage(
        video,
        sx,
        sy,
        sw,
        sh,
        0,
        0,
        canvas.width,
        canvas.height
    );

}


/* =========================================================
   SHOT PREVIEW
========================================================= */

function renderShotPreview(){

    const container =
        document.getElementById(
            "shots"
        );

    container.innerHTML = "";

    capturedImages.forEach(
        (image,index) => {

            const img =
                document.createElement(
                    "img"
                );

            img.src = image;

            img.className =
                "shot";

            img.onclick = () => {

                currentShot =
                    index;

                startRetake(index);

            };

            container.appendChild(
                img
            );

        }
    );

}


/* =========================================================
   RETAKE
========================================================= */

function startRetake(index){

    currentShot = index;

    let number = 3;

    const countdown =
        document.getElementById(
            "countdown"
        );

    countdown.classList.remove(
        "hidden"
    );

    countdown.innerText =
        number;

    countdownTimer =
        setInterval(() => {

            number--;

            if(number > 0){

                countdown.innerText =
                    number;

            }else{

                clearInterval(
                    countdownTimer
                );

                countdown.classList.add(
                    "hidden"
                );

                takePhoto(index);

                renderShotPreview();

            }

        },1000);

}


/* =========================================================
   CONFIRM PHOTOS
========================================================= */

function confirmPhotos(){

    if(
        capturedImages.some(
            x => !x
        )
    ){

        alert(
            "ยังถ่ายรูปไม่ครบ"
        );

        return;

    }

    stopCamera();

    createFinalCanvas();

    showStep(4);

}


/* =========================================================
   STOP CAMERA
========================================================= */

function stopCamera(){

    if(mediaStream){

        mediaStream
            .getTracks()
            .forEach(
                track =>
                    track.stop()
            );

        mediaStream = null;

    }

}


/* =========================================================
   LOAD IMAGE
========================================================= */

function loadImage(src){

    return new Promise(
        (resolve,reject) => {

            const img =
                new Image();

            img.onload =
                () => resolve(img);

            img.onerror =
                reject;

            img.src = src;

        }
    );

}


/* =========================================================
   CREATE FINAL CANVAS
========================================================= */

async function createFinalCanvas(){

    const canvas =
        document.getElementById(
            "final-preview"
        );

    const ctx =
        canvas.getContext("2d");


    if(targetShotCount === 1){

        canvas.width = 1200;

        canvas.height = 1950;

        ctx.fillStyle =
            "white";

        ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );


        const img =
            await loadImage(
                capturedImages[0]
            );


        ctx.drawImage(
            img,
            75,
            150,
            1050,
            1350
        );


        if(selectedFrame){

            const frame =
                await loadImage(
                    selectedFrame
                );

            ctx.drawImage(
                frame,
                0,
                0,
                canvas.width,
                canvas.height
            );

        }

    }else{

        canvas.width = 1050;

        canvas.height = 3150;

        ctx.fillStyle =
            "white";

        ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );


        const photos =
            await Promise.all(
                capturedImages.map(
                    x => loadImage(x)
                )
            );


        const positions =
            [
                375,
                1125,
                1875
            ];


        photos.forEach(
            (img,index) => {

                ctx.drawImage(
                    img,
                    73.5,
                    positions[index],
                    900,
                    675
                );

            }
        );


        if(selectedFrame){

            const frame =
                await loadImage(
                    selectedFrame
                );

            ctx.drawImage(
                frame,
                0,
                0,
                canvas.width,
                canvas.height
            );

        }

    }


    updatePreview();

}


/* =========================================================
   IMAGE PROCESSING
========================================================= */

function processImage(
    sourceCanvas
){

    const width =
        sourceCanvas.width;

    const height =
        sourceCanvas.height;


    const output =
        document.createElement(
            "canvas"
        );

    output.width =
        width;

    output.height =
        height;


    const ctx =
        output.getContext(
            "2d",
            {
                willReadFrequently:true
            }
        );


    ctx.drawImage(
        sourceCanvas,
        0,
        0
    );


    const image =
        ctx.getImageData(
            0,
            0,
            width,
            height
        );


    const data =
        image.data;


    const brightness =
        Number(
            document.getElementById(
                "brightness"
            ).value
        );


    const contrast =
        Number(
            document.getElementById(
                "contrast"
            ).value
        ) / 100;


    const gamma =
        Number(
            document.getElementById(
                "gamma"
            ).value
        ) / 100;


    const shadow =
        Number(
            document.getElementById(
                "shadow"
            ).value
        );


    const highlight =
        Number(
            document.getElementById(
                "highlight"
            ).value
        );


    const dither =
        document.getElementById(
            "dither"
        ).value;


    /*
       1. grayscale
       2. brightness
       3. contrast
       4. gamma
    */

    const gray =
        new Float32Array(
            width * height
        );


    for(
        let y=0;
        y<height;
        y++
    ){

        for(
            let x=0;
            x<width;
            x++
        ){

            const i =
                (y * width + x) * 4;


            let r =
                data[i];

            let g =
                data[i+1];

            let b =
                data[i+2];


            /*
                Grayscale
            */

            let value =
                0.299*r +
                0.587*g +
                0.114*b;


            /*
                Brightness
            */

            value +=
                brightness;


            /*
                Contrast
            */

            value =
                ((value - 128) *
                contrast) +
                128;


            /*
                Shadow

                lift darkest areas
            */

            if(
                value < 128
            ){

                value +=
                    shadow *
                    (1 -
                    value / 128);

            }


            /*
                Highlight

                keep highlights white
            */

            if(
                value > 128
            ){

                value +=
                    highlight *
                    ((value - 128) / 127);

            }


            value =
                Math.max(
                    0,
                    Math.min(
                        255,
                        value
                    )
                );


            /*
                Gamma

                gamma > 1
                makes midtones darker

                Therefore invert it here
                so gamma 1.20 opens
                dark facial areas.
            */

            value =
                255 *
                Math.pow(
                    value / 255,
                    1 / gamma
                );


            gray[
                y * width + x
            ] =
                value;

        }

    }


    /*
        DITHER
    */

    if(dither === "floyd"){

        floydSteinberg(
            gray,
            width,
            height
        );

    }
    else if(
        dither === "ordered"
    ){

        orderedDither(
            gray,
            width,
            height
        );

    }
    else{

        /*
            Simple threshold
        */

        for(
            let i=0;
            i<gray.length;
            i++
        ){

            gray[i] =
                gray[i] < 128
                    ? 0
                    : 255;

        }

    }


    /*
        Put result
    */

    const outputData =
        ctx.createImageData(
            width,
            height
        );


    for(
        let i=0;
        i<gray.length;
        i++
    ){

        const p =
            i * 4;

        const v =
            gray[i];


        outputData.data[p] =
            v;

        outputData.data[p+1] =
            v;

        outputData.data[p+2] =
            v;

        outputData.data[p+3] =
            255;

    }


    ctx.putImageData(
        outputData,
        0,
        0
    );


    return output;

}


/* =========================================================
   FLOYD STEINBERG
========================================================= */

function floydSteinberg(
    pixels,
    width,
    height
){

    for(
        let y=0;
        y<height;
        y++
    ){

        for(
            let x=0;
            x<width;
            x++
        ){

            const index =
                y * width + x;


            const old =
                pixels[index];


            const newValue =
                old < 128
                    ? 0
                    : 255;


            const error =
                old - newValue;


            pixels[index] =
                newValue;


            /*
               right
            */

            if(
                x + 1 < width
            ){

                pixels[
                    index + 1
                ] +=
                    error * 7 / 16;

            }


            /*
               bottom-left
            */

            if(
                x > 0 &&
                y + 1 < height
            ){

                pixels[
                    index +
                    width - 1
                ] +=
                    error * 3 / 16;

            }


            /*
               bottom
            */

            if(
                y + 1 < height
            ){

                pixels[
                    index +
                    width
                ] +=
                    error * 5 / 16;

            }


            /*
               bottom-right
            */

            if(
                x + 1 < width &&
                y + 1 < height
            ){

                pixels[
                    index +
                    width + 1
                ] +=
                    error * 1 / 16;

            }

        }

    }

}


/* =========================================================
   ORDERED DITHER
========================================================= */

function orderedDither(
    pixels,
    width,
    height
){

    const matrix =
        [
            [0,8,2,10],
            [12,4,14,6],
            [3,11,1,9],
            [15,7,13,5]
        ];


    for(
        let y=0;
        y<height;
        y++
    ){

        for(
            let x=0;
            x<width;
            x++
        ){

            const i =
                y * width + x;


            const threshold =
                (
                    matrix[
                        y % 4
                    ][
                        x % 4
                    ] + 0.5
                ) * 16;


            pixels[i] =
                pixels[i] <
                threshold
                    ? 0
                    : 255;

        }

    }

}

        );

        processImage(
            final
        );

    */

    const ctx =
        final.getContext("2d");

    final.width =
        processed.width;

    final.height =
        processed.height;

    ctx.drawImage(
        processed,
        0,
        0
    );

}


/* =========================================================
   CREATE PRINT IMAGE
========================================================= */

function createPrintImage(){

    const source =
        document.getElementById(
            "final-preview"
        );


    /*
        Printer = 576 dots
    */

    const width =
        PRINTER_DOTS;


    const ratio =
        source.height /
        source.width;


    const height =
        Math.round(
            width * ratio
        );


    const resized =
        document.createElement(
            "canvas"
        );


    resized.width =
        width;

    resized.height =
        height;


    const ctx =
        resized.getContext(
            "2d"
        );


    /*
        White background
    */

    ctx.fillStyle =
        "white";

    ctx.fillRect(
        0,
        0,
        width,
        height
    );


    /*
        Resize final image
    */

    ctx.drawImage(
        source,
        0,
        0,
        width,
        height
    );


    /*
        Process AGAIN at
        printer resolution
    */

    return processImage(
        resized
    );

}

    }

    /*
        80x130
    */

    else{

            );

        },300);

    };

}

/* =========================================================
   DIRECT SERIAL ESC/POS
========================================================= */

async function printDirectSerial(){

    if(
        !("serial" in navigator)
    ){

        alert(
            "Chrome/Edge ตัวนี้ไม่รองรับ Web Serial"
        );

        return;

    }


    try{

        /*
            เลือก port
        */

        let port =
            await navigator.serial
                .requestPort();


        await port.open({
            baudRate:115200
        });


        /*
            สร้างภาพที่ผ่าน
            dithering แล้ว
        */

        const canvas =
            createPrintImage();


        /*
            Convert canvas
            to 1-bit raster
        */

        const bitmap =
            canvasToEscPos(
                canvas
            );


        const writer =
            port.writable
                .getWriter();


        /*
            Initialize
        */

        await writer.write(
            new Uint8Array([
                0x1B,
                0x40
            ])
        );


        /*
            Print bitmap
        */

        await writer.write(
            bitmap
        );


        /*
            Feed
        */

        await writer.write(
            new Uint8Array([
                0x1B,
                0x64,
                0x05
            ])
        );


        /*
            Cut
        */

        await writer.write(
            new Uint8Array([
                0x1D,
                0x56,
                0x00
            ])
        );


        writer.releaseLock();

        await port.close();


        alert(
            "ส่งรูปไปยังเครื่องพิมพ์แล้ว"
        );


    }catch(error){

        console.error(error);

        alert(
            "Direct Serial ใช้งานไม่ได้\n\n" +
            error.message +
            "\n\n" +
            "ถ้า USB ของ Xprinter ถูกติดตั้งเป็น Printer ของ macOS " +
            "ให้ใช้ปุ่ม 'พิมพ์ผ่าน Mac'"
        );

    }

}


/* =========================================================
   CANVAS -> ESC/POS RASTER
========================================================= */

function canvasToEscPos(
    canvas
){

    const ctx =
        canvas.getContext(
            "2d",
            {
                willReadFrequently:true
            }
        );


    const width =
        canvas.width;

    const height =
        canvas.height;


    /*
        ESC/POS GS v 0

        1 bit per pixel
    */


    const bytesPerRow =
        Math.ceil(
            width / 8
        );


    const image =
        ctx.getImageData(
            0,
            0,
            width,
            height
        );


    const data =
        image.data;


    const header =
        [

            0x1D,
            0x76,
            0x30,
            0x00,

            bytesPerRow & 0xff,

            (bytesPerRow >> 8)
                & 0xff,

            height & 0xff,

            (height >> 8)
                & 0xff

        ];


    const output =
        new Uint8Array(
            header.length +
            bytesPerRow *
            height
        );


    output.set(
        header,
        0
    );


    let offset =
        header.length;


    for(
        let y=0;
        y<height;
        y++
    ){

        for(
            let x=0;
            x<width;
            x+=8
        ){

            let byte = 0;


            for(
                let bit=0;
                bit<8;
                bit++
            ){

                const px =
                    x + bit;


                if(px >= width)
                    continue;


                const i =
                    (
                        y *
                        width +
                        px
                    ) * 4;


                const r =
                    data[i];


                const g =
                    data[i+1];


                const b =
                    data[i+2];


                const brightness =
                    (
                        r +
                        g +
                        b
                    ) / 3;


                /*
                    black = 1
                */

                if(
                    brightness < 128
                ){

                    byte |=
                        1 <<
                        (7-bit);

                }

            }


            output[offset++] =
                byte;

        }

    }


    return output;

}
