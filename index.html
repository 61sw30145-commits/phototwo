<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thermal Photo Booth</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @media print {
      body * {
        visibility: hidden;
      }
      #print-area, #print-area * {
        visibility: visible;
      }
      #print-area {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
      }
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 font-sans">

  <div class="max-w-4xl mx-auto p-4 sm:p-6">
    <header class="text-center mb-6">
      <h1 class="text-3xl font-bold text-gray-900">Thermal Photo Booth</h1>
      <p class="text-sm text-gray-600 mt-1">ถ่ายภาพความทรงจำ พิมพ์ลงกระดาษความร้อน</p>
    </header>

    <!-- Step 1: Select Shots -->
    <div id="step-shots" class="bg-white rounded-xl shadow-md p-6 mb-6">
      <h2 class="text-xl font-semibold mb-4 text-center">1. เลือกจำนวนช็อต</h2>
      <div class="flex justify-center gap-4">
        <button onclick="selectShots(1)" class="px-6 py-3 bg-indigo-600 text-white font-medium rounded-lg hover:bg-indigo-700 transition">1 ช็อต (แนวตั้ง)</button>
        <button onclick="selectShots(3)" class="px-6 py-3 bg-indigo-600 text-white font-medium rounded-lg hover:bg-indigo-700 transition">3 ช็อต (แถวยาว)</button>
      </div>
    </div>

    <!-- Step 2: Camera & Capture -->
    <div id="step-camera" class="bg-white rounded-xl shadow-md p-6 mb-6 hidden">
      <h2 class="text-xl font-semibold mb-2 text-center">2. ถ่ายภาพ (<span id="current-shot-index">1</span>/<span id="total-shots-display">1</span>)</h2>
      <div class="relative max-w-md mx-auto bg-black rounded-lg overflow-hidden aspect-video flex items-center justify-center">
        <video id="webcam" autoplay playsinline class="w-full h-full object-cover transform -scale-x-100"></video>
        <div id="countdown" class="absolute inset-0 bg-black/40 flex items-center justify-center text-white text-7xl font-bold hidden">3</div>
      </div>
      <div class="text-center mt-4">
        <button id="btn-capture" onclick="startCaptureSequence()" class="px-8 py-3 bg-red-600 text-white font-bold rounded-full hover:bg-red-700 shadow-lg transition">ถ่ายรูป</button>
      </div>
    </div>

    <!-- Step 3: Select Frame -->
    <div id="step-frame" class="bg-white rounded-xl shadow-md p-6 mb-6 hidden">
      <h2 class="text-xl font-semibold mb-4 text-center">3. เลือกกรอบรูป</h2>
      <div id="frame-options" class="flex flex-wrap justify-center gap-4">
        <!-- Frame buttons generated by JS -->
      </div>
    </div>

    <!-- Step 4: Preview & Print -->
    <div id="step-preview" class="bg-white rounded-xl shadow-md p-6 mb-6 hidden">
      <h2 class="text-xl font-semibold mb-4 text-center">4. ตัวอย่างภาพถ่าย & สั่งพิมพ์</h2>
      
      <!-- Screen Display Area -->
      <div class="flex justify-center mb-6">
        <div id="print-area" class="border p-2 bg-white shadow-inner">
          <canvas id="final-canvas" class="max-w-full h-auto mx-auto border"></canvas>
        </div>
      </div>

      <!-- Controls -->
      <div class="max-w-md mx-auto space-y-4">
        <div class="flex items-center justify-center gap-3">
          <label for="print-copies" class="font-medium">จำนวนสำเนา:</label>
          <input type="number" id="print-copies" value="1" min="1" max="10" class="w-16 border rounded p-1 text-center">
        </div>

        <div class="flex flex-col sm:flex-row justify-center gap-3">
          <button onclick="triggerPrint()" class="flex-1 py-3 bg-green-600 text-white font-medium rounded-lg hover:bg-green-700 transition">พิมพ์ผ่านเบราว์เซอร์</button>
          <button onclick="printDirectSerial()" class="flex-1 py-3 bg-blue-600 text-white font-medium rounded-lg hover:bg-blue-700 transition">พิมพ์ตรง (Serial API)</button>
        </div>

        <div class="text-center pt-2">
          <button onclick="resetApp()" class="text-sm text-gray-500 underline hover:text-gray-800">เริ่มถ่ายใหม่</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // System State Variables
    let targetShotCount = 1;
    let capturedImages = [];
    let selectedFrame = null;
    let serialPort = null;

    // Frame Configurations (สามารถใส่ URL กรอบ PNG ใสตามต้องการได้)
    const frameConfigs = {
      1: [
        { name: 'ไม่มีกรอบ', url: null },
        // { name: 'กรอบ 1', url: 'frames/frame1_1shot.png' }
      ],
      3: [
        { name: 'ไม่มีกรอบ', url: null },
        // { name: 'กรอบ 1', url: 'frames/frame1_3shots.png' }
      ]
    };

    // Helper: Load Image Element
    function loadImage(src) {
      return new Promise((resolve, reject) => {
        if (!src) return resolve(null);
        const img = new Image();
        img.crossOrigin = "Anonymous";
        img.onload = () => resolve(img);
        img.onerror = (err) => reject(err);
        img.src = src;
      });
    }

    // ----------------------------------------------------
    // Dithering Algorithms (Floyd-Steinberg)
    // ----------------------------------------------------
    function createDitheredImage(imgElement, contrast = 0.35, threshold = 185) {
      const canvas = document.createElement('canvas');
      const width = imgElement.width || imgElement.naturalWidth;
      const height = imgElement.height || imgElement.naturalHeight;
      canvas.width = width;
      canvas.height = height;

      const ctx = canvas.getContext('2d');
      ctx.drawImage(imgElement, 0, 0);

      const imgData = ctx.getImageData(0, 0, width, height);
      const data = imgData.data;

      // Contrast adjustment factor
      const factor = (259 * (contrast * 255 + 255)) / (255 * (259 - contrast * 255));

      // Grayscale & Contrast
      for (let i = 0; i < data.length; i += 4) {
        let gray = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
        gray = factor * (gray - 128) + 128;
        gray = Math.min(255, Math.max(0, gray));
        data[i] = data[i + 1] = data[i + 2] = gray;
      }

      // Floyd-Steinberg Dithering
      for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
          const idx = (y * width + x) * 4;
          const oldPixel = data[idx];
          const newPixel = oldPixel < threshold ? 0 : 255;

          data[idx] = data[idx + 1] = data[idx + 2] = newPixel;
          const error = oldPixel - newPixel;

          if (x + 1 < width) {
            data[idx + 4] += error * (7 / 16);
          }
          if (y + 1 < height) {
            if (x > 0) data[((y + 1) * width + (x - 1)) * 4] += error * (3 / 16);
            data[((y + 1) * width + x) * 4] += error * (5 / 16);
            if (x + 1 < width) data[((y + 1) * width + (x + 1)) * 4] += error * (1 / 16);
          }
        }
      }

      ctx.putImageData(imgData, 0, 0);
      return canvas;
    }

    // ----------------------------------------------------
    // ESC/POS Command Generator for Direct Printing
    // ----------------------------------------------------
    function canvasToEscPosRaster(canvas) {
      const ctx = canvas.getContext('2d');
      const width = canvas.width;
      const height = canvas.height;
      const imgData = ctx.getImageData(0, 0, width, height).data;

      const widthBytes = Math.ceil(width / 8);
      const commands = [];

      // Initialize Printer (ESC @)
      commands.push(new Uint8Array([0x1B, 0x40]));

      // ESC/POS GS v 0 Raster Image Command
      const header = new Uint8Array([
        0x1D, 0x76, 0x30, 0x00,
        widthBytes & 0xFF, (widthBytes >> 8) & 0xFF,
        height & 0xFF, (height >> 8) & 0xFF
      ]);
      commands.push(header);

      const rasterData = new Uint8Array(widthBytes * height);

      for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
          const idx = (y * width + x) * 4;
          const r = imgData[idx];
          const g = imgData[idx + 1];
          const b = imgData[idx + 2];
          const brightness = (r + g + b) / 3;

          if (brightness < 128) {
            const byteIdx = y * widthBytes + Math.floor(x / 8);
            const bitIdx = 7 - (x % 8);
            rasterData[byteIdx] |= (1 << bitIdx);
          }
        }
      }

      commands.push(rasterData);

      // Feed lines & Cut Paper (GS V 66 0)
      commands.push(new Uint8Array([0x1B, 0x64, 0x04])); // Feed 4 lines
      commands.push(new Uint8Array([0x1D, 0x56, 0x42, 0x00])); // Cut paper

      return commands;
    }

    // ----------------------------------------------------
    // App Flow & UI Handlers
    // ----------------------------------------------------
    function selectShots(count) {
      targetShotCount = count;
      capturedImages = [];
      document.getElementById('total-shots-display').innerText = count;
      document.getElementById('current-shot-index').innerText = 1;

      document.getElementById('step-shots').classList.add('hidden');
      document.getElementById('step-camera').classList.remove('hidden');

      startWebcam();
    }

    async function startWebcam() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: "user" },
          audio: false
        });
        const video = document.getElementById('webcam');
        video.srcObject = stream;
      } catch (err) {
        alert("ไม่สามารถเข้าถึงกล้องเว็บแคมได้: " + err.message);
      }
    }

    function stopWebcam() {
      const video = document.getElementById('webcam');
      if (video.srcObject) {
        video.srcObject.getTracks().forEach(track => track.stop());
        video.srcObject = null;
      }
    }

    function startCaptureSequence() {
      document.getElementById('btn-capture').disabled = true;
      let count = 3;
      const countdownEl = document.getElementById('countdown');
      countdownEl.innerText = count;
      countdownEl.classList.remove('hidden');

      const timer = setInterval(() => {
        count--;
        if (count > 0) {
          countdownEl.innerText = count;
        } else {
          clearInterval(timer);
          countdownEl.classList.add('hidden');
          capturePhoto();
        }
      }, 1000);
    }

    function capturePhoto() {
      const video = document.getElementById('webcam');
      const canvas = document.createElement('canvas');
      canvas.width = video.videoWidth || 1280;
      canvas.height = video.videoHeight || 720;

      const ctx = canvas.getContext('2d');
      // Reverse mirror effect
      ctx.translate(canvas.width, 0);
      ctx.scale(-1, 1);
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      capturedImages.push(canvas.toDataURL('image/png'));

      if (capturedImages.length < targetShotCount) {
        document.getElementById('current-shot-index').innerText = capturedImages.length + 1;
        document.getElementById('btn-capture').disabled = false;
      } else {
        stopWebcam();
        document.getElementById('step-camera').classList.add('hidden');
        setupFrameSelection();
      }
    }

    function setupFrameSelection() {
      document.getElementById('step-frame').classList.remove('hidden');
      const container = document.getElementById('frame-options');
      container.innerHTML = '';

      const frames = frameConfigs[targetShotCount] || [{ name: 'ไม่มีกรอบ', url: null }];
      frames.forEach((frame, idx) => {
        const btn = document.createElement('button');
        btn.className = "px-4 py-2 bg-gray-200 hover:bg-indigo-100 border rounded-lg font-medium transition";
        btn.innerText = frame.name;
        btn.onclick = () => {
          selectedFrame = frame.url;
          document.getElementById('step-frame').classList.add('hidden');
          document.getElementById('step-preview').classList.remove('hidden');
          renderFinalCanvas();
        };
        container.appendChild(btn);
      });
    }

    // ----------------------------------------------------
    // Rendering & Printing Logic (Updated)
    // ----------------------------------------------------

    // 1. Render Final Canvas บนหน้าจอ (แสดงรูปสีจริงปกติ ไม่ผ่าน Dithering)
    async function renderFinalCanvas() {
      const canvas = document.getElementById('final-canvas');
      const ctx = canvas.getContext('2d');

      if (targetShotCount === 1) {
        canvas.width = 1200;
        canvas.height = 1950;

        ctx.fillStyle = "#FFFFFF";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        try {
          const rawImages = await Promise.all(capturedImages.map(imgSrc => loadImage(imgSrc)));
          if (rawImages[0]) {
            ctx.drawImage(rawImages[0], 75, 150, 1050, 1350);
          }

          if (selectedFrame) {
            const frameImg = await loadImage(selectedFrame);
            if (frameImg) ctx.drawImage(frameImg, 0, 0, canvas.width, canvas.height);
          }
        } catch (err) {
          console.error("เกิดข้อผิดพลาดในการสร้าง Canvas 1 ช็อต", err);
        }

      } else {
        canvas.width = 1050;
        canvas.height = 3150;

        ctx.fillStyle = "#FFFFFF";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        try {
          const rawImages = await Promise.all(capturedImages.map(imgSrc => loadImage(imgSrc)));
          const topYs = [375, 1125, 1875];

          rawImages.forEach((img, i) => {
            if (img) {
              ctx.drawImage(img, 73.5, topYs[i], 900, 675);
            }
          });

          if (selectedFrame) {
            const frameImg = await loadImage(selectedFrame);
            if (frameImg) ctx.drawImage(frameImg, 0, 0, canvas.width, canvas.height);
          }
        } catch (err) {
          console.error("เกิดข้อผิดพลาดในการสร้าง Canvas 3 ช็อต", err);
        }
      }
    }

    // 2. สร้าง Canvas แบบ Dithered สำหรับใช้พิมพ์เท่านั้น
    async function generateDitheredCanvas() {
      const printCanvas = document.createElement('canvas');
      const ctx = printCanvas.getContext('2d');

      if (targetShotCount === 1) {
        printCanvas.width = 1200;
        printCanvas.height = 1950;

        ctx.fillStyle = "#FFFFFF";
        ctx.fillRect(0, 0, printCanvas.width, printCanvas.height);

        const rawImages = await Promise.all(capturedImages.map(imgSrc => loadImage(imgSrc)));
        if (rawImages[0]) {
          const ditheredPhoto = createDitheredImage(rawImages[0], 0.35, 185);
          ctx.drawImage(ditheredPhoto, 75, 150, 1050, 1350);
        }

        if (selectedFrame) {
          const frameImg = await loadImage(selectedFrame);
          if (frameImg) ctx.drawImage(frameImg, 0, 0, printCanvas.width, printCanvas.height);
        }
      } else {
        printCanvas.width = 1050;
        printCanvas.height = 3150;

        ctx.fillStyle = "#FFFFFF";
        ctx.fillRect(0, 0, printCanvas.width, printCanvas.height);

        const rawImages = await Promise.all(capturedImages.map(imgSrc => loadImage(imgSrc)));
        const topYs = [375, 1125, 1875];

        rawImages.forEach((img, i) => {
          if (img) {
            const ditheredPhoto = createDitheredImage(img, 0.35, 185);
            ctx.drawImage(ditheredPhoto, 73.5, topYs[i], 900, 675);
          }
        });

        if (selectedFrame) {
          const frameImg = await loadImage(selectedFrame);
          if (frameImg) ctx.drawImage(frameImg, 0, 0, printCanvas.width, printCanvas.height);
        }
      }

      return printCanvas;
    }

    // 3. พิมพ์ผ่านระบบ Print ของเบราว์เซอร์ (แปลงเป็น Dithered ชั่วคราวเฉพาะตอนกดสั่งพิมพ์)
    async function triggerPrint() {
      const copies = parseInt(document.getElementById('print-copies').value) || 1;
      const mainCanvas = document.getElementById('final-canvas');
      
      // สร้าง Canvas Dithered ชั่วคราว
      const ditheredCanvas = await generateDitheredCanvas();
      
      // สลับ Canvas บนหน้าจอเป็น Dithered ชั่วคราว
      const screenCtx = mainCanvas.getContext('2d');
      screenCtx.clearRect(0, 0, mainCanvas.width, mainCanvas.height);
      screenCtx.drawImage(ditheredCanvas, 0, 0);

      // สั่งพิมพ์
      for (let i = 0; i < copies; i++) {
        window.print();
      }

      // สลับ Canvas บนหน้าจอกลับมาเป็นรูปสีปกติทันทีหลังกดพิมพ์
      await renderFinalCanvas();
    }

    // 4. พิมพ์ตรงผ่าน Web Serial API (ส่งรูป Dithered ไปแปลงเป็น ESC/POS Raster)
    async function printDirectSerial() {
      if (!('serial' in navigator)) {
        alert("เบราว์เซอร์นี้ไม่รองรับ Web Serial API กรุณาใช้ Chrome หรือ Edge");
        return;
      }

      try {
        if (!serialPort) {
          serialPort = await navigator.serial.requestPort();
        }

        if (!serialPort.writable) {
          await serialPort.open({ baudRate: 115200 });
        }

        // สร้าง Dithered Canvas สำหรับพิมพ์
        const ditheredCanvas = await generateDitheredCanvas();
        const writer = serialPort.writable.getWriter();
        const copies = parseInt(document.getElementById('print-copies').value) || 1;
        const printCommands = canvasToEscPosRaster(ditheredCanvas);

        for (let c = 0; c < copies; c++) {
          for (const cmd of printCommands) {
            await writer.write(cmd);
          }
        }

        writer.releaseLock();
        alert("ส่งคำสั่งพิมพ์ไปยังเครื่องพิมพ์ใบเสร็จเรียบร้อยแล้ว!");
      } catch (err) {
        console.error("เกิดข้อผิดพลาดในการพิมพ์ Serial:", err);
        alert("ไม่สามารถสั่งพิมพ์โดยตรงได้: " + err.message);
      }
    }

    // Reset Application
    function resetApp() {
      stopWebcam();
      capturedImages = [];
      selectedFrame = null;
      document.getElementById('btn-capture').disabled = false;

      document.getElementById('step-preview').classList.add('hidden');
      document.getElementById('step-frame').classList.add('hidden');
      document.getElementById('step-camera').classList.add('hidden');
      document.getElementById('step-shots').classList.remove('hidden');
    }
  </script>
</body>
</html>
