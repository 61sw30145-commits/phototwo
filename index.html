<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dithering Image Converter</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col items-center justify-center p-4">

  <div class="max-w-xl w-full bg-gray-800 p-6 rounded-2xl shadow-xl flex flex-col items-center gap-6">
    <h1 class="text-2xl font-bold text-gray-100">Dithering Image Converter</h1>

    <!-- ปุ่มอัปโหลดรูปภาพ -->
    <div class="w-full flex justify-center">
      <label class="cursor-pointer bg-blue-600 hover:bg-blue-500 text-white font-medium py-2.5 px-5 rounded-lg transition-all shadow-md">
        <span>เลือกรูปภาพ</span>
        <input type="file" id="imageInput" accept="image/*" class="hidden">
      </label>
    </div>

    <!-- ส่วนแสดงภาพ -->
    <div class="w-full flex flex-col md:flex-row items-center justify-center gap-4">
      <div id="previewContainer" class="hidden flex flex-col items-center">
        <p class="text-sm text-gray-400 mb-2">ภาพต้นฉบับ</p>
        <img id="sourceImage" class="max-w-[200px] max-h-[200px] rounded-lg border border-gray-700 object-contain">
      </div>

      <div id="canvasContainer" class="hidden flex flex-col items-center">
        <p class="text-sm text-gray-400 mb-2">ภาพ Dithered ขาวดำ</p>
        <canvas id="ditherCanvas" class="max-w-[280px] rounded-lg border border-gray-700 bg-white"></canvas>
      </div>
    </div>

    <!-- ปุ่มดาวน์โหลด -->
    <button id="downloadBtn" class="hidden bg-green-600 hover:bg-green-500 text-white font-medium py-2.5 px-6 rounded-lg transition-all shadow-md">
      ดาวน์โหลดรูป Dithered
    </button>
  </div>

  <script>
    const imageInput = document.getElementById('imageInput');
    const sourceImage = document.getElementById('sourceImage');
    const ditherCanvas = document.getElementById('ditherCanvas');
    const previewContainer = document.getElementById('previewContainer');
    const canvasContainer = document.getElementById('canvasContainer');
    const downloadBtn = document.getElementById('downloadBtn');

    // เมื่อเลือกรูปภาพ
    imageInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        sourceImage.onload = () => {
          processDithering(sourceImage);
        };
        sourceImage.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    // ฟังก์ชันประมวลผล Dithering
    function processDithering(img) {
      const ctx = ditherCanvas.getContext('2d');
      
      // กำหนดขนาด Canvas ตามภาพต้นฉบับ
      ditherCanvas.width = img.naturalWidth;
      ditherCanvas.height = img.naturalHeight;

      // วาดรูปต้นฉบับลง Canvas
      ctx.drawImage(img, 0, 0);

      // ดึงข้อมูลพิกเซล
      const imgData = ctx.getImageData(0, 0, ditherCanvas.width, ditherCanvas.height);
      const data = imgData.data;
      const w = ditherCanvas.width;
      const h = ditherCanvas.height;

      // 1. แปลง RGB เป็น Grayscale Array (0 - 255)
      const gray = new Float32Array(w * h);
      for (let i = 0; i < data.length; i += 4) {
        gray[i / 4] = data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114;
      }

      // 2. อัลกอริทึม Floyd-Steinberg Dithering
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const idx = y * w + x;
          const oldPixel = gray[idx];
          
          // Threshold ค่าสี: สว่างเกิน 128 เป็นขาว (255), มืดกว่าเป็นดำ (0)
          const newPixel = oldPixel > 128 ? 255 : 0;
          gray[idx] = newPixel;
          
          const err = oldPixel - newPixel;

          // กระจายค่า Error ให้พิกเซลข้างเคียง
          if (x + 1 < w)             gray[idx + 1]     += err * (7 / 16);
          if (y + 1 < h && x > 0)     gray[idx + w - 1] += err * (3 / 16);
          if (y + 1 < h)             gray[idx + w]     += err * (5 / 16);
          if (y + 1 < h && x + 1 < w) gray[idx + w + 1] += err * (1 / 16);
        }
      }

      // 3. เขียนค่าสีกลับลงใน Canvas (RGBA)
      for (let i = 0; i < gray.length; i++) {
        const val = gray[i];
        const pxIdx = i * 4;
        data[pxIdx]     = val; // R
        data[pxIdx + 1] = val; // G
        data[pxIdx + 2] = val; // B
        data[pxIdx + 3] = 255; // Alpha
      }

      ctx.putImageData(imgData, 0, 0);

      // แสดงผล UI
      previewContainer.classList.remove('hidden');
      canvasContainer.classList.remove('hidden');
      downloadBtn.classList.remove('hidden');
    }

    // ฟังก์ชันดาวน์โหลดรูป
    downloadBtn.addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = 'dithered-image.png';
      link.href = ditherCanvas.toDataURL('image/png');
      link.click();
    });
  </script>
</body>
</html>
