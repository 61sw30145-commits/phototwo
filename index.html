<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimal Photo Booth (2 Shots)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style id="dynamic-print-style">
    /* -------------------------------------------------- */
    /* พิมพ์ */
    /* -------------------------------------------------- */
    @media print {
      @page {
        size: 70mm 210mm;
        margin: 0;
      }
      body {
        margin: 0 !important;
        padding: 0 !important;
        background: #fff !important;
      }
      body * { 
        visibility: hidden !important; 
      }
      #print-area, #print-area *, #print-image-tag { 
        visibility: visible !important; 
      }
      #print-area {
        position: absolute;
        left: 0;
        top: 0;
        width: 70mm !important;
        height: auto;
        display: block !important;
      }
      #print-image-tag {
        width: 100% !important;
        height: auto !important;
        display: block !important;
        object-fit: contain;
      }
      #back-button-container, .bg-white, #final-canvas { 
        display: none !important; 
      }
    }

    #webcam { transform: scaleX(-1); }

    /* มาร์กมุม 4 มุมสำหรับกรอบถ่ายรูป */
    .corner-mark {
      position: absolute;
      width: 20px;
      height: 20px;
      border-color: #ffffff;
      border-style: solid;
      pointer-events: none;
    }
    .top-left { top: -2px; left: -2px; border-width: 3px 0 0 3px; }
    .top-right { top: -2px; right: -2px; border-width: 3px 3px 0 0; }
    .bottom-left { bottom: -2px; left: -2px; border-width: 0 0 3px 3px; }
    .bottom-right { bottom: -2px; right: -2px; border-width: 0 3px 3px 0; }
  </style>
</head>
<body class="bg-stone-50 text-stone-800 font-sans min-h-screen flex flex-col items-center justify-center p-4 relative">

  <!-- ปุ่มย้อนกลับ -->
  <div id="back-button-container" class="absolute top-6 left-6 hidden z-50">
    <button onclick="goBack()" class="flex items-center gap-2 px-4 py-2 bg-white border border-stone-200 rounded-full shadow-sm hover:border-stone-800 transition text-sm font-medium text-stone-700">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
      </svg>
      ย้อนกลับ
    </button>
  </div>

  <!-- Step 1: หน้าแรก -->
  <div id="step-1" class="text-center space-y-6">
    <h1 class="text-4xl font-light tracking-wide">PHOTO BOOTH</h1>
    <button onclick="goToStep(15)" class="px-8 py-3 bg-stone-800 text-white rounded-full hover:bg-stone-700 transition">กดเพื่อเริ่มถ่ายรูป</button>
  </div>

  <!-- Step 1.5: เลือกจำนวนช็อต (2 ช็อต) -->
  <div id="step-15" class="hidden text-center space-y-6 w-full max-w-md">
    <h2 class="text-2xl font-light">เลือกจำนวนช็อต</h2>
    <div class="flex justify-center">
      <button onclick="selectShotCount(2)" class="p-6 bg-white border border-stone-200 rounded-2xl shadow-sm hover:border-stone-800 transition flex flex-col items-center gap-2 group w-64">
        <span class="text-3xl font-light group-hover:scale-110 transition">2</span>
        <span class="text-sm font-medium text-stone-600">ถ่าย 2 ช็อต (70x210 mm)</span>
      </button>
    </div>
  </div>

  <!-- Step 2: เลือกกรอบรูป -->
  <div id="step-2" class="hidden text-center space-y-6 w-full max-w-lg">
    <h2 class="text-2xl font-light">เลือกกรอบรูป</h2>
    <div id="frame-list" class="grid grid-cols-2 gap-4 max-h-[70vh] overflow-y-auto p-2"></div>
  </div>

  <!-- Step 3: กล้อง & กำหนดพื้นที่รูปภาพ -->
  <div id="step-3" class="hidden text-center space-y-4 w-full max-w-md">
    <div id="camera-container" class="relative w-full bg-black rounded-lg overflow-hidden shadow-sm flex items-center justify-center aspect-[4/3]">
      <video id="webcam" autoplay playsinline class="w-full h-full object-cover"></video>

      <!-- กรอบไกด์กำหนดตำแหน่งรูปถ่าย -->
      <div id="camera-guide" class="absolute inset-0 pointer-events-none flex items-center justify-center z-10">
        <div id="guide-box" class="w-[85%] aspect-[65/50] border-2 border-white/80 shadow-[0_0_0_9999px_rgba(0,0,0,0.55)] relative flex items-center justify-center transition-all duration-300 rounded-md">
          <div class="corner-mark top-left"></div>
          <div class="corner-mark top-right"></div>
          <div class="corner-mark bottom-left"></div>
          <div class="corner-mark bottom-right"></div>
        </div>
      </div>

      <img id="shot-preview-overlay" class="absolute inset-0 w-full h-full object-contain hidden z-20" />
      <div id="countdown" class="absolute inset-0 flex items-center justify-center text-6xl font-bold text-white bg-black/40 hidden z-30">3</div>
    </div>

    <div id="retake-controls" class="hidden space-y-3">
      <p class="text-sm font-medium text-stone-700">กดที่รูปเพื่อถ่ายใหม่เฉพาะช็อตนั้น:</p>
      <div id="shots-preview" class="flex justify-center gap-2"></div>
      <button onclick="goToStep(4)" class="px-6 py-2 bg-stone-800 text-white rounded-full">ยืนยันรูปภาพ</button>
    </div>
  </div>

  <!-- Step 4: สั่งพิมพ์ -->
  <div id="step-4" class="hidden text-center space-y-6 w-full max-w-md">
    <h2 class="text-2xl font-light">พิมพ์รูปภาพ / บันทึกไฟล์</h2>

    <div id="print-area" class="flex justify-center">
      <canvas id="final-canvas" class="max-w-full rounded shadow-md border border-stone-200"></canvas>
      <img id="print-image-tag" class="hidden" alt="Print Render">
    </div>

    <div class="bg-white p-4 rounded-xl border border-stone-200 space-y-3">
      <div class="flex flex-col gap-2 pt-1">
        <button onclick="triggerPrint()" class="w-full py-3 bg-stone-800 text-white rounded-xl hover:bg-stone-700 transition font-medium flex items-center justify-center gap-2 text-base shadow-sm">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z" />
          </svg>
          สั่งพิมพ์สลิป (AirPrint / Printer Sharing)
        </button>

        <button onclick="downloadImage()" class="w-full py-2.5 bg-white text-stone-800 border border-stone-300 hover:bg-stone-50 rounded-xl transition font-medium text-sm flex items-center justify-center gap-2">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
          </svg>
          บันทึกรูปภาพลงเครื่อง (.jpg)
        </button>
      </div>
    </div>

    <button onclick="goToStep(3)" class="text-sm text-stone-500 hover:text-stone-800 underline">แก้ไข/ถ่ายใหม่</button>
  </div>

  <script>
    let currentStep = 1;
    let stepHistory = [1];
    let selectedFrame = null;
    let targetShotCount = 2;
    let capturedImages = [];
    let frames = [];
    let captureTimer = null;
    let isCapturing = false;
    let mediaStream = null;

    async function loadConfig() {
      try {
        const res = await fetch('config.json');
        const config = await res.json();
        frames = config.frames || [];
      } catch (e) {
        frames = [
          { id: 1, name: "ความรักมันออกแบบไม่ได้", file: "4.png", shots: 2 },
          { id: 2, name: "ข่าวสังคมเขาชมไม่สร่าง", file: "5.png", shots: 2 },
          { id: 3, name: "มช", file: "7.png", shots: 2 },
          { id: 4, name: "สังคม", file: "6.png", shots: 2 },
          { id: 5, name: "สังวิท", file: "8.png", shots: 2 },
          { id: 6, name: "อาเซียน", file: "9.png", shots: 2 },
          { id: 7, name: "จีออ", file: "10.png", shots: 2 }
        ];
      }
    }
    loadConfig();

    // เปิดการใช้งานกล้องค้างไว้ล่วงหน้า
    async function initCamera() {
      if (!mediaStream) {
        try {
          mediaStream = await navigator.mediaDevices.getUserMedia({ 
            video: { width: { ideal: 1920 }, height: { ideal: 1080 }, facingMode: "user" }, 
            audio: false 
          });
          document.getElementById('webcam').srcObject = mediaStream;
        } catch (err) {
          alert("ไม่สามารถเข้าถึงกล้องได้ กรุณ่อนุญาตสิทธิ์การใช้กล้อง");
        }
      }
    }

    function selectShotCount(count) {
      targetShotCount = count;
      capturedImages = new Array(count).fill(null);
      initCamera(); // ขอสิทธิ์ใช้กล้องตั้งแต่กดเลือกช็อต
      goToStep(2);
    }

    function goToStep(step, isBack = false) {
      if (isCapturing) stopCapture();

      document.querySelectorAll('[id^="step-"]').forEach(el => el.classList.add('hidden'));
      document.getElementById(`step-${step}`).classList.remove('hidden');

      if (!isBack && currentStep !== step) {
        stepHistory.push(step);
      }
      currentStep = step;

      const backBtn = document.getElementById('back-button-container');
      if (step === 1) {
        backBtn.classList.add('hidden');
      } else {
        backBtn.classList.remove('hidden');
      }

      if (step === 2) renderFrames();
      if (step === 3) {
        if (!capturedImages[0]) {
          startCameraAndCapture();
        } else {
          showRetakeUI();
        }
      }
      if (step === 4) renderFinalCanvas(false);
    }

    function goBack() {
      if (stepHistory.length > 1) {
        stepHistory.pop();
        const prevStep = stepHistory[stepHistory.length - 1];
        goToStep(prevStep, true);
      }
    }

    function stopCapture() {
      isCapturing = false;
      if (captureTimer) clearInterval(captureTimer);
      document.getElementById('countdown').classList.add('hidden');
    }

    function renderFrames() {
      const container = document.getElementById('frame-list');
      const filteredFrames = frames.filter(f => f.shots === targetShotCount);

      if (filteredFrames.length === 0) {
        container.innerHTML = `<p class="col-span-2 text-stone-500 py-8">ไม่พบกรอบรูปสำหรับ ${targetShotCount} ช็อต</p>`;
        return;
      }

      container.innerHTML = filteredFrames.map(f => `
        <div onclick="selectFrame('${f.file}')" class="group border border-stone-200 p-3 rounded-xl cursor-pointer hover:border-stone-800 bg-white shadow-sm hover:shadow-md transition flex flex-col items-center space-y-2">
          <div class="w-full aspect-[70/210] bg-stone-100 rounded-lg overflow-hidden flex items-center justify-center p-1 border border-stone-100 relative">
            <img src="${f.file}" alt="${f.name}" class="w-full h-full object-contain group-hover:scale-105 transition duration-200 z-10" onerror="this.src='https://via.placeholder.com/150?text=No+Preview'">
          </div>
          <p class="text-sm font-medium text-stone-700 group-hover:text-stone-900">${f.name}</p>
        </div>
      `).join('');
    }

    function selectFrame(file) {
      selectedFrame = file;
      goToStep(3);
    }

    async function startCameraAndCapture() {
      await initCamera();
      document.getElementById('retake-controls').classList.add('hidden');
      document.getElementById('camera-guide').classList.remove('hidden');

      setTimeout(() => {
        capturedImages = new Array(targetShotCount).fill(null);
        isCapturing = true;
        captureNext(0);
      }, 500);
    }

    function captureNext(index) {
      if (!isCapturing || index >= targetShotCount) {
        showRetakeUI();
        return;
      }

      document.getElementById('shot-preview-overlay').classList.add('hidden');

      let count = 3;
      const cdEl = document.getElementById('countdown');
      cdEl.classList.remove('hidden');
      cdEl.innerText = count;

      captureTimer = setInterval(() => {
        count--;
        if (count > 0) {
          cdEl.innerText = count;
        } else {
          clearInterval(captureTimer);
          cdEl.classList.add('hidden');

          takePhoto(index);

          const previewImg = document.getElementById('shot-preview-overlay');
          previewImg.src = capturedImages[index];
          previewImg.classList.remove('hidden');

          setTimeout(() => {
            if (isCapturing) captureNext(index + 1);
          }, 1500);
        }
      }, 1000);
    }

    // ครอปรูปตามพิกัดของกรอบ guide-box ในหน้าจอจริง
    function takePhoto(index) {
      const video = document.getElementById('webcam');
      const container = document.getElementById('camera-container');
      const guideBox = document.getElementById('guide-box');
      const canvas = document.createElement('canvas');

      canvas.width = 975;
      canvas.height = 750;

      const containerRect = container.getBoundingClientRect();
      const guideRect = guideBox.getBoundingClientRect();

      // คำนวณสัดส่วนของ guide box บนคอนเทนเนอร์กล้อง
      const scaleX = video.videoWidth / containerRect.width;
      const scaleY = video.videoHeight / containerRect.height;

      const cropX = (guideRect.left - containerRect.left) * scaleX;
      const cropY = (guideRect.top - containerRect.top) * scaleY;
      const cropW = guideRect.width * scaleX;
      const cropH = guideRect.height * scaleY;

      const ctx = canvas.getContext('2d');
      // พลิกกระจกแนวนอนเพื่อความสมจริง
      ctx.translate(canvas.width, 0);
      ctx.scale(-1, 1);

      // คำนวณตำแหน่งกลับด้านเนื่องจากสลับพิกัด X จากการกระจก
      const mirrorCropX = video.videoWidth - cropX - cropW;

      ctx.drawImage(video, mirrorCropX, cropY, cropW, cropH, 0, 0, canvas.width, canvas.height);

      capturedImages[index] = canvas.toDataURL('image/png');
    }

    function retakeSingleShot(index) {
      isCapturing = true;
      document.getElementById('shot-preview-overlay').classList.add('hidden');
      document.getElementById('retake-controls').classList.add('hidden');
      document.getElementById('camera-guide').classList.remove('hidden');

      let count = 3;
      const cdEl = document.getElementById('countdown');
      cdEl.classList.remove('hidden');
      cdEl.innerText = count;

      captureTimer = setInterval(() => {
        count--;
        if (count > 0) {
          cdEl.innerText = count;
        } else {
          clearInterval(captureTimer);
          cdEl.classList.add('hidden');
          takePhoto(index);

          const previewImg = document.getElementById('shot-preview-overlay');
          previewImg.src = capturedImages[index];
          previewImg.classList.remove('hidden');

          setTimeout(() => {
            document.getElementById('shot-preview-overlay').classList.add('hidden');
            showRetakeUI();
          }, 1500);
        }
      }, 1000);
    }

    function showRetakeUI() {
      isCapturing = false;
      document.getElementById('shot-preview-overlay').classList.add('hidden');
      document.getElementById('camera-guide').classList.add('hidden');

      const previewContainer = document.getElementById('shots-preview');
      previewContainer.innerHTML = capturedImages.map((img, i) => `
        <div class="relative cursor-pointer border-2 border-stone-300 hover:border-stone-800 rounded overflow-hidden group" onclick="retakeSingleShot(${i})">
          <img src="${img}" class="w-20 h-16 object-cover">
          <div class="absolute inset-0 bg-black/40 flex items-center justify-center opacity-90 transition">
            <span class="text-white text-[11px] font-medium bg-black/60 px-1.5 py-0.5 rounded">ถ่ายใหม่</span>
          </div>
        </div>
      `).join('');

      document.getElementById('retake-controls').classList.remove('hidden');
    }

    function loadImage(src) {
      return new Promise((resolve, reject) => {
        if (!src) return resolve(null);
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = src;
      });
    }

    function createDitheredImage(imgElement, scale = 1.0, contrast = 1.35) {
      const canvas = document.createElement('canvas');
      canvas.width = imgElement.width;
      canvas.height = imgElement.height;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const tempCanvas = document.createElement('canvas');
      const tempCtx = tempCanvas.getContext('2d');

      const gridSize = 6; 
      const cols = Math.ceil(canvas.width / gridSize);
      const rows = Math.ceil(canvas.height / gridSize);

      tempCanvas.width = cols;
      tempCanvas.height = rows;
      tempCtx.drawImage(imgElement, 0, 0, cols, rows);

      const imgData = tempCtx.getImageData(0, 0, cols, rows);
      const data = imgData.data;

      ctx.fillStyle = '#000000';

      for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
          const idx = (y * cols + x) * 4;
          const r = data[idx];
          const g = data[idx + 1];
          const b = data[idx + 2];

          let brightness = 0.299 * r + 0.587 * g + 0.114 * b;
          brightness = ((brightness - 128) * contrast) + 128;
          brightness = Math.max(0, Math.min(255, brightness));

          let normBrightness = brightness / 255;
          normBrightness = Math.pow(normBrightness, 1.3);
          
          const darkness = 1 - normBrightness;

          if (darkness > 0.04) { 
            const centerX = x * gridSize + gridSize / 2;
            const centerY = y * gridSize + gridSize / 2;
            
            const maxRadius = (gridSize / 2) * 1.22; 
            const radius = darkness * maxRadius;

            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      }

      return canvas;
    }

    async function renderFinalCanvas(isForPrint = false) {
      const canvas = document.getElementById('final-canvas');
      const ctx = canvas.getContext('2d');

      canvas.width = 1050; 
      canvas.height = 3150;

      ctx.fillStyle = "#FFFFFF";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      try {
        const rawImages = await Promise.all(capturedImages.map(imgSrc => loadImage(imgSrc)));

        const frameWidth = 975;   // 65mm
        const frameHeight = 750;  // 50mm
        const marginX = 37.5;     // 2.5mm

        const topYs = [975, 1801.5];

        rawImages.forEach((img, i) => {
          if (img) {
            const photoToDraw = isForPrint ? createDitheredImage(img, 1.0, 1.35) : img;
            ctx.drawImage(photoToDraw, marginX, topYs[i], frameWidth, frameHeight);
          }
        });

        if (selectedFrame) {
          const frameImg = await loadImage(selectedFrame);
          if (frameImg) ctx.drawImage(frameImg, 0, 0, canvas.width, canvas.height);
        }

        if (isForPrint) {
          const printImgTag = document.getElementById('print-image-tag');
          printImgTag.src = canvas.toDataURL('image/png');
        }
      } catch (err) {
        console.error("เกิดข้อผิดพลาดในการสร้าง Canvas", err);
      }
    }

    async function triggerPrint() {
      await renderFinalCanvas(true);

      setTimeout(() => {
        window.print();

        setTimeout(() => {
          renderFinalCanvas(false);
        }, 1000);
      }, 300);
    }

    async function downloadImage() {
      const canvas = document.getElementById('final-canvas');
      const dataUrl = canvas.toDataURL('image/jpeg', 0.95);

      try {
        const response = await fetch(dataUrl);
        const blob = await response.blob();
        const file = new File([blob], `photobooth-${Date.now()}.jpg`, { type: 'image/jpeg' });

        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({
            files: [file],
            title: 'Photo Booth',
            text: 'รูปถ่ายจาก Photo Booth'
          });
        } else {
          const link = document.createElement('a');
          link.download = `photobooth-${Date.now()}.jpg`;
          link.href = dataUrl;
          link.click();
        }
      } catch (err) {
        console.error('Save image failed:', err);
      }
    }
  </script>
</body>
</html>
