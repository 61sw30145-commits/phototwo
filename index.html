<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimal Photo Booth</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Library สำหรับสร้าง GIF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js"></script>
  <!-- Library สำหรับสร้าง QR Code -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    @media print {
      body * { visibility: hidden; }
      #print-area, #print-area * { visibility: visible; }
      #print-area { position: absolute; left: 0; top: 0; width: 100%; }
    }
    #webcam { transform: scaleX(-1); }
  </style>
</head>
<body class="bg-stone-50 text-stone-800 font-sans min-h-screen flex flex-col items-center justify-center p-4">

  <!-- Step 1: หน้าแรก -->
  <div id="step-1" class="text-center space-y-6">
    <h1 class="text-4xl font-light tracking-wide">PHOTO BOOTH</h1>
    <button onclick="goToStep(2)" class="px-8 py-3 bg-stone-800 text-white rounded-full hover:bg-stone-700 transition">กดเพื่อเริ่มถ่ายรูป</button>
  </div>

  <!-- Step 2: เลือกกรอบรูป -->
  <div id="step-2" class="hidden text-center space-y-6 w-full max-w-lg">
    <h2 class="text-2xl font-light">เลือกกรอบรูป</h2>
    <div id="frame-list" class="grid grid-cols-2 gap-4 max-h-[70vh] overflow-y-auto p-2"></div>
  </div>

  <!-- Step 3: กล้อง & เลือกแก้ไขรูป -->
  <div id="step-3" class="hidden text-center space-y-4 w-full max-w-md">
    <div class="relative w-full bg-black rounded-lg overflow-hidden shadow-sm flex items-center justify-center">
      <video id="webcam" autoplay playsinline class="w-full h-auto object-contain"></video>

      <!-- เส้น Guide Frame สัดส่วน 700:550 -->
      <div id="camera-guide" class="absolute inset-0 pointer-events-none flex items-center justify-center z-10">
        <div class="w-full aspect-[700/550] border-2 border-dashed border-white/90 shadow-[0_0_0_9999px_rgba(0,0,0,0.4)] relative flex items-center justify-center">
          <span class="text-xs text-white/70 bg-black/40 px-2 py-0.5 rounded backdrop-blur-sm absolute top-2">ให้อยู่ในกรอบนี้</span>
        </div>
      </div>

      <img id="shot-preview-overlay" class="absolute inset-0 w-full h-full object-contain hidden z-20" />
      <div id="countdown" class="absolute inset-0 flex items-center justify-center text-6xl font-bold text-white bg-black/40 hidden z-30">3</div>
    </div>
    
    <div id="retake-controls" class="hidden space-y-3">
      <p class="text-sm font-medium text-stone-700">กดที่รูปเพื่อถ่ายใหม่เฉพาะช็อตนั้น:</p>
      <div id="shots-preview" class="flex justify-center gap-2"></div>
      <button onclick="goToStep(4)" class="px-6 py-2 bg-stone-800 text-white rounded-full">ยืนยันรูปภาพ</button>
    </div>
  </div>

  <!-- Step 4: สั่งปริ้นท์ & รับไฟล์ดิจิทัล -->
  <div id="step-4" class="hidden text-center space-y-6 w-full max-w-md">
    <h2 class="text-2xl font-light">สั่งปริ้นท์ & รับไฟล์ดิจิทัล</h2>
    
    <div id="print-area" class="flex justify-center">
      <canvas id="final-canvas" class="max-w-full rounded shadow-md"></canvas>
    </div>

    <!-- ส่วน QR Code แสดงไฟล์ GIF -->
    <div class="bg-white p-4 rounded-xl border border-stone-200 flex flex-col items-center space-y-2">
      <p class="text-sm font-medium text-stone-700">สแกนเพื่อรับไฟล์ GIF ขยับได้</p>
      <div id="qrcode" class="p-2 bg-white rounded flex items-center justify-center min-h-[128px]"></div>
      <p id="qr-status" class="text-xs text-stone-400">กำลังเตรียมไฟล์...</p>
    </div>

    <div class="flex items-center justify-center gap-4">
      <button onclick="window.print()" class="px-6 py-2 bg-stone-800 text-white rounded-full">สั่งปริ้นท์</button>
      <button onclick="goToStep(3)" class="px-6 py-2 border border-stone-800 rounded-full">แก้ไขรูปภาพ</button>
    </div>
  </div>

  <script>
    let selectedFrame = null;
    let capturedImages = [null, null, null];
    let frames = [];

    async function loadConfig() {
      try {
        const res = await fetch('config.json');
        const config = await res.json();
        frames = config.frames || [];
      } catch (e) {
        frames = [
          { id: 1, name: "กรอบสีฟ้า", file: "frame3.png" },
          { id: 2, name: "กรอบสีดำ", file: "frame2.png" },
          { id: 3, name: "กรอบชมพู", file: "frame1.png" },
          { id: 4, name: "ใบเสร็จ", file: "frame4.png" }
        ];
      }
    }
    loadConfig();

    function goToStep(step) {
      document.querySelectorAll('[id^="step-"]').forEach(el => el.classList.add('hidden'));
      document.getElementById(`step-${step}`).classList.remove('hidden');

      if (step === 2) renderFrames();
      if (step === 3) {
        if (!capturedImages[0]) {
          startCameraAndCapture();
        } else {
          showRetakeUI();
        }
      }
      if (step === 4) {
        renderFinalCanvas();
        generateFastGIF();
      }
    }

    function renderFrames() {
      const container = document.getElementById('frame-list');
      container.innerHTML = frames.map(f => `
        <div onclick="selectFrame('${f.file}')" class="group border border-stone-200 p-3 rounded-xl cursor-pointer hover:border-stone-800 bg-white shadow-sm hover:shadow-md transition flex flex-col items-center space-y-2">
          <div class="w-full aspect-[8/23] bg-stone-100 rounded-lg overflow-hidden flex items-center justify-center p-1 border border-stone-100 relative">
            <img src="${f.file}" alt="${f.name}" class="w-full h-full object-contain group-hover:scale-105 transition duration-200 z-10" onerror="this.src='https://via.placeholder.com/150x431?text=No+Preview'">
          </div>
          <p class="text-sm font-medium text-stone-700 group-hover:text-stone-900">${f.name}</p>
        </div>
      `).join('');
    }

    function selectFrame(file) {
      selectedFrame = file;
      goToStep(3);
    }

    async function startCameraAndCapture() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ 
          video: { width: { ideal: 1280 }, height: { ideal: 720 } }, 
          audio: false 
        });
        document.getElementById('webcam').srcObject = stream;
        document.getElementById('retake-controls').classList.add('hidden');
        document.getElementById('camera-guide').classList.remove('hidden');
        
        setTimeout(() => {
          capturedImages = [null, null, null];
          captureNext(0);
        }, 1000);
      } catch (err) {
        alert("ไม่สามารถเข้าถึงกล้องได้ กรุณ่อนุญาตสิทธิ์การใช้กล้อง");
      }
    }

    function captureNext(index) {
      if (index >= 3) {
        showRetakeUI();
        return;
      }

      document.getElementById('shot-preview-overlay').classList.add('hidden');

      let count = 3;
      const cdEl = document.getElementById('countdown');
      cdEl.classList.remove('hidden');
      cdEl.innerText = count;

      const timer = setInterval(() => {
        count--;
        if (count > 0) {
          cdEl.innerText = count;
        } else {
          clearInterval(timer);
          cdEl.classList.add('hidden');
          
          takePhoto(index);

          const previewImg = document.getElementById('shot-preview-overlay');
          previewImg.src = capturedImages[index];
          previewImg.classList.remove('hidden');

          setTimeout(() => {
            captureNext(index + 1);
          }, 3000);
        }
      }, 1000);
    }

    function takePhoto(index) {
      const video = document.getElementById('webcam');
      const canvas = document.createElement('canvas');
      
      canvas.width = 700;
      canvas.height = 550;
      
      const vWidth = video.videoWidth;
      const vHeight = video.videoHeight;
      
      const cropWidth = vWidth;
      const cropHeight = vWidth * (550 / 700);
      
      const startX = 0;
      const startY = Math.max(0, (vHeight - cropHeight) / 2);
      
      const ctx = canvas.getContext('2d');
      
      ctx.translate(canvas.width, 0);
      ctx.scale(-1, 1);
      
      ctx.drawImage(video, startX, startY, cropWidth, cropHeight, 0, 0, canvas.width, canvas.height);
      capturedImages[index] = canvas.toDataURL('image/png');
    }

    function retakeSingleShot(index) {
      document.getElementById('shot-preview-overlay').classList.add('hidden');
      document.getElementById('retake-controls').classList.add('hidden');
      document.getElementById('camera-guide').classList.remove('hidden');
      
      let count = 3;
      const cdEl = document.getElementById('countdown');
      cdEl.classList.remove('hidden');
      cdEl.innerText = count;

      const timer = setInterval(() => {
        count--;
        if (count > 0) {
          cdEl.innerText = count;
        } else {
          clearInterval(timer);
          cdEl.classList.add('hidden');
          takePhoto(index);
          
          const previewImg = document.getElementById('shot-preview-overlay');
          previewImg.src = capturedImages[index];
          previewImg.classList.remove('hidden');

          setTimeout(() => {
            document.getElementById('shot-preview-overlay').classList.add('hidden');
            showRetakeUI();
          }, 3000);
        }
      }, 1000);
    }

    function showRetakeUI() {
      document.getElementById('shot-preview-overlay').classList.add('hidden');
      document.getElementById('camera-guide').classList.add('hidden');

      const previewContainer = document.getElementById('shots-preview');
      previewContainer.innerHTML = capturedImages.map((img, i) => `
        <div class="relative cursor-pointer border-2 border-stone-300 hover:border-stone-800 rounded overflow-hidden group" onclick="retakeSingleShot(${i})">
          <img src="${img}" class="w-20 h-16 object-cover">
          <div class="absolute inset-0 bg-black/40 flex items-center justify-center opacity-90 transition">
            <span class="text-white text-[11px] font-medium bg-black/60 px-1.5 py-0.5 rounded">ถ่ายใหม่</span>
          </div>
        </div>
      `).join('');

      document.getElementById('retake-controls').classList.remove('hidden');
    }

    function renderFinalCanvas() {
      const canvas = document.getElementById('final-canvas');
      const ctx = canvas.getContext('2d');

      canvas.width = 800;
      canvas.height = 2300;

      ctx.fillStyle = "#FFFFFF";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      let loadedCount = 0;
      capturedImages.forEach((imgSrc, i) => {
        const img = new Image();
        img.onload = () => {
          ctx.drawImage(img, 50, 150 + (i * 600), 700, 550);
          loadedCount++;
          
          if (loadedCount === 3 && selectedFrame) {
            const frameImg = new Image();
            frameImg.onload = () => {
              ctx.drawImage(frameImg, 0, 0, canvas.width, canvas.height);
            };
            frameImg.src = selectedFrame;
          }
        };
        img.src = imgSrc;
      });
    }

    // ปรับปรุงฟังก์ชันสร้าง GIF ให้เร็วขึ้น (ย่อขนาด GIF เหลือ 350x275 + ลดคุณภาพ Render เพื่อความเร็วระดับมิลลิวินาที)
    function generateFastGIF() {
      const qrContainer = document.getElementById('qrcode');
      const statusText = document.getElementById('qr-status');
      qrContainer.innerHTML = "";
      statusText.innerText = "กำลังประมวลผล QR Code...";

      const gif = new GIF({
        workers: 4,
        quality: 20, // ปรับคุณภาพสมดุลระหว่างความเร็วและขนาดไฟล์
        width: 350,  // ปรับย่อขนาด GIF ช่วยลดเวลาประมวลผลลง 4 เท่า
        height: 275,
        workerScript: 'https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.worker.js'
      });

      let loadedCount = 0;
      capturedImages.forEach(imgSrc => {
        const img = new Image();
        img.onload = () => {
          gif.addFrame(img, { delay: 350 });
          loadedCount++;
          if (loadedCount === 3) {
            gif.render();
          }
        };
        img.src = imgSrc;
      });

      gif.on('finished', function(blob) {
        uploadAndShowQR(blob);
      });
    }

    async function uploadAndShowQR(blob) {
      const statusText = document.getElementById('qr-status');
      const formData = new FormData();
      formData.append('image', blob);

      try {
        const res = await fetch('https://api.imgur.com/3/image', {
          method: 'POST',
          headers: { Authorization: 'Client-ID 546c25a59c58ad7' },
          body: formData
        });
        const data = await res.json();

        if (data.success) {
          const downloadUrl = data.data.link;
          document.getElementById('qrcode').innerHTML = "";
          new QRCode(document.getElementById('qrcode'), {
            text: downloadUrl,
            width: 128,
            height: 128
          });
          statusText.innerText = "สแกนเพื่อรับไฟล์ GIF";
        } else {
          statusText.innerText = "เกิดข้อผิดพลาดในการรับไฟล์";
        }
      } catch (err) {
        statusText.innerText = "ข้อผิดพลาดอินเทอร์เน็ต";
      }
    }
  </script>
</body>
</html>
