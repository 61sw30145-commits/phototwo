<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimal Photo Booth</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <style id="dynamic-print-style">

    @media print {

      @page {
        size: 70mm 210mm;
        margin: 0;
      }

      html,
      body {
        width: 100%;
        margin: 0 !important;
        padding: 0 !important;
        background: #fff !important;
      }

      body * {
        visibility: hidden !important;
      }

      #print-area,
      #print-area *,
      #final-canvas {
        visibility: visible !important;
      }

      #print-area {
        position: absolute !important;
        left: 0 !important;
        top: 0 !important;
        width: 70mm !important;
        margin: 0 !important;
        padding: 0 !important;
        display: block !important;
      }

      #final-canvas {
        width: 70mm !important;
        height: auto !important;
        display: block !important;

        margin: 0 !important;
        padding: 0 !important;
        border: none !important;
        box-shadow: none !important;
        border-radius: 0 !important;

        /*
         * สำคัญ:
         * เราแปลงภาพเป็น 1-bit dithering แล้ว
         * จึงไม่ต้องการให้ browser ทำ color conversion แปลก ๆ
         */
        image-rendering: pixelated;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      #back-button-container,
      #print-settings,
      #preview-controls {
        display: none !important;
      }
    }

    #webcam {
      transform: scaleX(-1);
    }

  </style>
</head>

<body class="bg-stone-50 text-stone-800 font-sans min-h-screen flex flex-col items-center justify-center p-4 relative">

  <!-- =========================================================
       BACK BUTTON
  ========================================================== -->

  <div id="back-button-container" class="absolute top-6 left-6 hidden">

    <button
      onclick="goBack()"
      class="flex items-center gap-2 px-4 py-2 bg-white border border-stone-200 rounded-full shadow-sm hover:border-stone-800 transition text-sm font-medium text-stone-700">

      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="w-4 h-4"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor">

        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M15 19l-7-7 7-7" />

      </svg>

      ย้อนกลับ

    </button>

  </div>


  <!-- =========================================================
       STEP 1
  ========================================================== -->

  <div
    id="step-1"
    class="text-center space-y-6">

    <h1 class="text-4xl font-light tracking-wide">
      PHOTO BOOTH
    </h1>

    <button
      onclick="goToStep(15)"
      class="px-8 py-3 bg-stone-800 text-white rounded-full hover:bg-stone-700 transition">

      กดเพื่อเริ่มถ่ายรูป

    </button>

  </div>


  <!-- =========================================================
       STEP 1.5
  ========================================================== -->

  <div
    id="step-15"
    class="hidden text-center space-y-6 w-full max-w-md">

    <h2 class="text-2xl font-light">
      เลือกจำนวนช็อต
    </h2>

    <div class="grid grid-cols-2 gap-4">

      <button
        onclick="selectShotCount(1)"
        class="p-6 bg-white border border-stone-200 rounded-2xl shadow-sm hover:border-stone-800 transition flex flex-col items-center gap-2 group">

        <span class="text-3xl font-light group-hover:scale-110 transition">
          1
        </span>

        <span class="text-sm font-medium text-stone-600">
          ถ่าย 1 ช็อต (80x130 mm)
        </span>

      </button>


      <button
        onclick="selectShotCount(3)"
        class="p-6 bg-white border border-stone-200 rounded-2xl shadow-sm hover:border-stone-800 transition flex flex-col items-center gap-2 group">

        <span class="text-3xl font-light group-hover:scale-110 transition">
          3
        </span>

        <span class="text-sm font-medium text-stone-600">
          ถ่าย 3 ช็อต (70x210 mm)
        </span>

      </button>

    </div>

  </div>


  <!-- =========================================================
       STEP 2 : FRAME
  ========================================================== -->

  <div
    id="step-2"
    class="hidden text-center space-y-6 w-full max-w-lg">

    <h2 class="text-2xl font-light">
      เลือกกรอบรูป
    </h2>

    <div
      id="frame-list"
      class="grid grid-cols-2 gap-4 max-h-[70vh] overflow-y-auto p-2">
    </div>

  </div>


  <!-- =========================================================
       STEP 3 : CAMERA
  ========================================================== -->

  <div
    id="step-3"
    class="hidden text-center space-y-4 w-full max-w-md">

    <div
      class="relative w-full bg-black rounded-lg overflow-hidden shadow-sm flex items-center justify-center">

      <video
        id="webcam"
        autoplay
        playsinline
        class="w-full h-auto object-contain">
      </video>


      <div
        id="camera-guide"
        class="absolute inset-0 pointer-events-none flex items-center justify-center z-10">

        <div
          id="guide-box"
          class="border-2 border-dashed border-white/90 shadow-[0_0_0_9999px_rgba(0,0,0,0.4)] relative flex items-center justify-center">

          <span
            class="text-xs text-white/70 bg-black/40 px-2 py-0.5 rounded backdrop-blur-sm absolute top-2">

            ให้อยู่ในกรอบนี้

          </span>

        </div>

      </div>


      <img
        id="shot-preview-overlay"
        class="absolute inset-0 w-full h-full object-contain hidden z-20" />


      <div
        id="countdown"
        class="absolute inset-0 flex items-center justify-center text-6xl font-bold text-white bg-black/40 hidden z-30">

        3

      </div>

    </div>


    <div
      id="retake-controls"
      class="hidden space-y-3">

      <p class="text-sm font-medium text-stone-700">
        กดที่รูปเพื่อถ่ายใหม่เฉพาะช็อตนั้น:
      </p>

      <div
        id="shots-preview"
        class="flex justify-center gap-2">
      </div>

      <button
        onclick="goToStep(4)"
        class="px-6 py-2 bg-stone-800 text-white rounded-full">

        ยืนยันรูปภาพ

      </button>

    </div>

  </div>


  <!-- =========================================================
       STEP 4 : PRINT
  ========================================================== -->

  <div
    id="step-4"
    class="hidden text-center space-y-6 w-full max-w-md">

    <h2 class="text-2xl font-light">
      พิมพ์รูปภาพ / บันทึกไฟล์
    </h2>


    <!--
      ส่วนนี้คือสิ่งที่จะถูกพิมพ์
    -->

    <div
      id="print-area"
      class="flex justify-center">

      <canvas
        id="final-canvas"
        class="max-w-full rounded shadow-md border border-stone-200">
      </canvas>

    </div>


    <!-- =======================================================
         THERMAL SETTINGS
    ======================================================== -->

    <div
      id="preview-controls"
      class="bg-white p-4 rounded-xl border border-stone-200 space-y-4">

      <div>

        <p class="text-sm font-medium text-stone-700 mb-1">
          โหมดพิมพ์ Thermal
        </p>

        <p class="text-xs text-stone-500">
          ระบบจะเปลี่ยนรูปเป็นขาว-ดำแบบจุดละเอียด
          เพื่อให้ใบหน้าไม่กลายเป็นก้อนดำ
        </p>

      </div>


      <!-- Brightness -->

      <div class="text-left">

        <div class="flex justify-between text-xs mb-1">

          <span>
            ความสว่าง
          </span>

          <span id="brightness-value">
            10
          </span>

        </div>

        <input
          id="brightness"
          type="range"
          min="-10"
          max="30"
          value="10"
          step="1"
          class="w-full"
          oninput="updateThermalSettings()">

      </div>


      <!-- Contrast -->

      <div class="text-left">

        <div class="flex justify-between text-xs mb-1">

          <span>
            Contrast
          </span>

          <span id="contrast-value">
            1.05
          </span>

        </div>

        <input
          id="contrast"
          type="range"
          min="0.80"
          max="1.20"
          value="1.05"
          step="0.01"
          class="w-full"
          oninput="updateThermalSettings()">

      </div>


      <button
        onclick="renderFinalCanvas()"
        class="w-full py-2 bg-stone-100 text-stone-700 hover:bg-stone-200 rounded-xl border border-stone-200 text-sm">

        🔄 ปรับภาพใหม่

      </button>

    </div>


    <!-- =======================================================
         PRINT SETTINGS
    ======================================================== -->

    <div
      id="print-settings"
      class="bg-white p-4 rounded-xl border border-stone-200 space-y-3">

      <div
        class="flex items-center justify-between text-sm">

        <label
          for="print-copies"
          class="font-medium text-stone-700">

          จำนวนที่ต้องการพิมพ์:

        </label>


        <div
          class="flex items-center border border-stone-300 rounded-lg overflow-hidden">

          <button
            onclick="adjustCopies(-1)"
            class="px-3 py-1 bg-stone-100 hover:bg-stone-200 text-stone-700">

            -

          </button>


          <input
            type="number"
            id="print-copies"
            value="1"
            min="1"
            max="10"
            class="w-12 text-center py-1 focus:outline-none text-stone-800 font-medium">


          <button
            onclick="adjustCopies(1)"
            class="px-3 py-1 bg-stone-100 hover:bg-stone-200 text-stone-700">

            +

          </button>

        </div>

      </div>


      <div
        class="flex flex-col gap-2 pt-2 border-t border-stone-100">

        <!-- PRINT -->

        <button
          onclick="triggerPrint()"
          class="w-full py-2.5 bg-stone-800 text-white rounded-xl hover:bg-stone-700 transition font-medium flex items-center justify-center gap-2">

          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="w-4 h-4"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor">

            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4H9v4a2 2 0 002 2zm6-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z" />

          </svg>

          สั่งพิมพ์

        </button>


        <!-- DOWNLOAD -->

        <button
          onclick="downloadImage()"
          class="w-full py-2 bg-white text-stone-800 border border-stone-300 hover:bg-stone-50 rounded-xl transition font-medium text-sm flex items-center justify-center gap-2">

          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="w-4 h-4"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor">

            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />

          </svg>

          บันทึกรูปภาพลงเครื่อง (.jpg)

        </button>

      </div>

    </div>


    <button
      onclick="goToStep(3)"
      class="text-sm text-stone-500 hover:text-stone-800 underline">

      แก้ไข/ถ่ายใหม่

    </button>

  </div>


  <!-- =========================================================
       JAVASCRIPT
  ========================================================== -->

  <script>

    /* =========================================================
       GLOBAL VARIABLES
    ========================================================== */

    let currentStep = 1;

    let stepHistory = [1];

    let selectedFrame = null;

    let targetShotCount = 3;

    let capturedImages = [];

    let frames = [];

    let captureTimer = null;

    let isCapturing = false;

    let mediaStream = null;


    /*
     * ค่าปรับภาพสำหรับ Thermal Printer
     *
     * ถ้าภาพดำเกินไป:
     * brightness เพิ่ม
     * contrast ลด
     *
     * ถ้าภาพจางเกินไป:
     * brightness ลด
     * contrast เพิ่ม
     */

    let THERMAL_BRIGHTNESS = 10;

    let THERMAL_CONTRAST = 1.05;


    /* =========================================================
       LOAD CONFIG
    ========================================================== */

    async function loadConfig() {

      try {

        const res = await fetch('config.json');

        const config = await res.json();

        frames = config.frames || [];

      } catch (e) {

        console.warn(
          "ไม่พบ config.json ใช้ค่า default"
        );

        frames = [

          {
            id: 1,
            name: "โปร่งใส (1 รูป)",
            file: "frame_1shot_1.png",
            shots: 1
          },

          {
            id: 2,
            name: "หนังสือพิมพ์ (1 รูป)",
            file: "frame_1shot_2.png",
            shots: 1
          },

          {
            id: 3,
            name: "โปร่งใส (3 รูป)",
            file: "frame1.png",
            shots: 3
          },

          {
            id: 4,
            name: "ใบเสร็จ (3 รูป)",
            file: "frame2.png",
            shots: 3
          },

          {
            id: 5,
            name: "บัวหลวงใหญ่ (3 รูป)",
            file: "frame3.png",
            shots: 3
          },

          {
            id: 6,
            name: "โหมดดาร์ก (3 รูป)",
            file: "frame4.png",
            shots: 3
          }

        ];

      }

    }


    loadConfig();


    /* =========================================================
       PRINT CSS
    ========================================================== */

    function updatePagePrintStyle() {

      const styleEl =
        document.getElementById(
          'dynamic-print-style'
        );

      const height =
        targetShotCount === 1
          ? '130mm'
          : '210mm';

      const width =
        targetShotCount === 1
          ? '80mm'
          : '70mm';


      styleEl.innerHTML = `

        @media print {

          @page {
            size: ${width} ${height};
            margin: 0;
          }

          html,
          body {
            width: 100%;
            margin: 0 !important;
            padding: 0 !important;
            background: #fff !important;
          }

          body * {
            visibility: hidden !important;
          }

          #print-area,
          #print-area *,
          #final-canvas {
            visibility: visible !important;
          }

          #print-area {
            position: absolute !important;
            left: 0 !important;
            top: 0 !important;
            width: ${width} !important;
            margin: 0 !important;
            padding: 0 !important;
            display: block !important;
          }

          #final-canvas {
            width: ${width} !important;
            height: auto !important;
            display: block !important;

            margin: 0 !important;
            padding: 0 !important;

            border: none !important;
            box-shadow: none !important;
            border-radius: 0 !important;

            image-rendering: pixelated;

            -webkit-print-color-adjust: exact !important;
            print-color-adjust: exact !important;
          }

        }

        #webcam {
          transform: scaleX(-1);
        }

      `;

    }


    /* =========================================================
       SELECT SHOT COUNT
    ========================================================== */

    function selectShotCount(count) {

      targetShotCount = count;

      capturedImages =
        new Array(count).fill(null);

      updatePagePrintStyle();

      goToStep(2);

    }


    /* =========================================================
       NAVIGATION
    ========================================================== */

    function goToStep(step, isBack = false) {

      if (isCapturing) {
        stopCapture();
      }


      if (
        currentStep === 3 &&
        step !== 3
      ) {

        stopCamera();

      }


      document
        .querySelectorAll('[id^="step-"]')
        .forEach(el => {

          el.classList.add('hidden');

        });


      document
        .getElementById(`step-${step}`)
        .classList.remove('hidden');


      if (
        !isBack &&
        currentStep !== step
      ) {

        stepHistory.push(step);

      }


      currentStep = step;


      const backBtn =
        document.getElementById(
          'back-button-container'
        );


      if (step === 1) {

        backBtn.classList.add('hidden');

      } else {

        backBtn.classList.remove('hidden');

      }


      if (step === 2) {

        renderFrames();

      }


      if (step === 3) {

        const guideBox =
          document.getElementById(
            'guide-box'
          );


        if (targetShotCount === 1) {

          guideBox.className =
            "w-full aspect-[70/90] border-2 border-dashed border-white/90 shadow-[0_0_0_9999px_rgba(0,0,0,0.4)] relative flex items-center justify-center";

        } else {

          guideBox.className =
            "w-full aspect-[60/45] border-2 border-dashed border-white/90 shadow-[0_0_0_9999px_rgba(0,0,0,0.4)] relative flex items-center justify-center";

        }


        if (!capturedImages[0]) {

          startCameraAndCapture();

        } else {

          showRetakeUI();

        }

      }


      if (step === 4) {

        /*
         * สร้างภาพก่อนแสดงหน้าพิมพ์
         */

        renderFinalCanvas();

      }

    }


    function goBack() {

      if (stepHistory.length > 1) {

        stepHistory.pop();

        const prevStep =
          stepHistory[
            stepHistory.length - 1
          ];

        goToStep(
          prevStep,
          true
        );

      }

    }


    /* =========================================================
       CAMERA
    ========================================================== */

    function stopCapture() {

      isCapturing = false;

      if (captureTimer) {

        clearInterval(captureTimer);

        captureTimer = null;

      }

      document
        .getElementById('countdown')
        .classList.add('hidden');

    }


    function stopCamera() {

      if (mediaStream) {

        mediaStream
          .getTracks()
          .forEach(track => track.stop());

        mediaStream = null;

      }

    }


    async function startCameraAndCapture() {

      try {

        mediaStream =
          await navigator.mediaDevices.getUserMedia({

            video: {

              width: {
                ideal: 1920
              },

              height: {
                ideal: 1080
              }

            },

            audio: false

          });


        document
          .getElementById('webcam')
          .srcObject = mediaStream;


        document
          .getElementById('retake-controls')
          .classList.add('hidden');


        document
          .getElementById('camera-guide')
          .classList.remove('hidden');


        setTimeout(() => {

          capturedImages =
            new Array(
              targetShotCount
            ).fill(null);

          isCapturing = true;

          captureNext(0);

        }, 1000);


      } catch (err) {

        console.error(err);

        alert(
          "ไม่สามารถเข้าถึงกล้องได้ กรุณาอนุญาตสิทธิ์การใช้กล้อง"
        );

      }

    }


    /* =========================================================
       CAPTURE
    ========================================================== */

    function captureNext(index) {

      if (
        !isCapturing ||
        index >= targetShotCount
      ) {

        showRetakeUI();

        return;

      }


      document
        .getElementById(
          'shot-preview-overlay'
        )
        .classList.add('hidden');


      let count = 3;


      const cdEl =
        document.getElementById(
          'countdown'
        );


      cdEl.classList.remove('hidden');

      cdEl.innerText = count;


      captureTimer =
        setInterval(() => {

          count--;


          if (count > 0) {

            cdEl.innerText = count;

          } else {

            clearInterval(
              captureTimer
            );

            captureTimer = null;

            cdEl.classList.add(
              'hidden'
            );


            takePhoto(index);


            const previewImg =
              document.getElementById(
                'shot-preview-overlay'
              );


            previewImg.src =
              capturedImages[index];


            previewImg.classList.remove(
              'hidden'
            );


            setTimeout(() => {

              if (isCapturing) {

                captureNext(
                  index + 1
                );

              }

            }, 3000);

          }

        }, 1000);

    }


    /* =========================================================
       TAKE PHOTO
    ========================================================== */

    function takePhoto(index) {

      const video =
        document.getElementById(
          'webcam'
        );


      const canvas =
        document.createElement(
          'canvas'
        );


      const vWidth =
        video.videoWidth;

      const vHeight =
        video.videoHeight;


      if (targetShotCount === 1) {

        canvas.width = 1050;

        canvas.height = 1350;


        const targetRatio =
          1050 / 1350;

        const videoRatio =
          vWidth / vHeight;


        let cropWidth;
        let cropHeight;
        let startX;
        let startY;


        if (
          videoRatio >
          targetRatio
        ) {

          cropHeight = vHeight;

          cropWidth =
            vHeight *
            targetRatio;

          startX =
            (vWidth - cropWidth) / 2;

          startY = 0;

        } else {

          cropWidth = vWidth;

          cropHeight =
            vWidth /
            targetRatio;

          startX = 0;

          startY =
            (vHeight - cropHeight) / 2;

        }


        const ctx =
          canvas.getContext('2d');


        /*
         * Mirror รูปให้เหมือน Photo Booth
         */

        ctx.translate(
          canvas.width,
          0
        );

        ctx.scale(
          -1,
          1
        );


        ctx.drawImage(

          video,

          startX,
          startY,
          cropWidth,
          cropHeight,

          0,
          0,
          canvas.width,
          canvas.height

        );


      } else {

        canvas.width = 900;

        canvas.height = 675;


        const targetRatio =
          900 / 675;

        const videoRatio =
          vWidth / vHeight;


        let cropWidth;
        let cropHeight;
        let startX;
        let startY;


        if (
          videoRatio >
          targetRatio
        ) {

          cropHeight = vHeight;

          cropWidth =
            vHeight *
            targetRatio;

          startX =
            (vWidth - cropWidth) / 2;

          startY = 0;

        } else {

          cropWidth = vWidth;

          cropHeight =
            vWidth /
            targetRatio;

          startX = 0;

          startY =
            (vHeight - cropHeight) / 2;

        }


        const ctx =
          canvas.getContext('2d');


        ctx.translate(
          canvas.width,
          0
        );

        ctx.scale(
          -1,
          1
        );


        ctx.drawImage(

          video,

          startX,
          startY,
          cropWidth,
          cropHeight,

          0,
          0,
          canvas.width,
          canvas.height

        );

      }


      capturedImages[index] =
        canvas.toDataURL(
          'image/png'
        );

    }


    /* =========================================================
       RETAKE SINGLE PHOTO
    ========================================================== */

    function retakeSingleShot(index) {

      isCapturing = true;


      document
        .getElementById(
          'shot-preview-overlay'
        )
        .classList.add('hidden');


      document
        .getElementById(
          'retake-controls'
        )
        .classList.add('hidden');


      document
        .getElementById(
          'camera-guide'
        )
        .classList.remove('hidden');


      let count = 3;


      const cdEl =
        document.getElementById(
          'countdown'
        );


      cdEl.classList.remove(
        'hidden'
      );


      cdEl.innerText = count;


      captureTimer =
        setInterval(() => {

          count--;


          if (count > 0) {

            cdEl.innerText = count;

          } else {

            clearInterval(
              captureTimer
            );

            captureTimer = null;


            cdEl.classList.add(
              'hidden'
            );


            takePhoto(index);


            const previewImg =
              document.getElementById(
                'shot-preview-overlay'
              );


            previewImg.src =
              capturedImages[index];


            previewImg.classList.remove(
              'hidden'
            );


            setTimeout(() => {

              document
                .getElementById(
                  'shot-preview-overlay'
                )
                .classList.add(
                  'hidden'
                );


              showRetakeUI();

            }, 3000);

          }

        }, 1000);

    }


    /* =========================================================
       RETAKE UI
    ========================================================== */

    function showRetakeUI() {

      isCapturing = false;


      document
        .getElementById(
          'shot-preview-overlay'
        )
        .classList.add('hidden');


      document
        .getElementById(
          'camera-guide'
        )
        .classList.add('hidden');


      const previewContainer =
        document.getElementById(
          'shots-preview'
        );


      previewContainer.innerHTML =
        capturedImages
          .map((img, i) => `

            <div
              class="relative cursor-pointer border-2 border-stone-300 hover:border-stone-800 rounded overflow-hidden group"
              onclick="retakeSingleShot(${i})">

              <img
                src="${img}"
                class="w-20 h-16 object-cover">

              <div
                class="absolute inset-0 bg-black/40 flex items-center justify-center opacity-90 transition">

                <span
                  class="text-white text-[11px] font-medium bg-black/60 px-1.5 py-0.5 rounded">

                  ถ่ายใหม่

                </span>

              </div>

            </div>

          `)
          .join('');


      document
        .getElementById(
          'retake-controls'
        )
        .classList.remove(
          'hidden'
        );

    }


    /* =========================================================
       LOAD IMAGE
    ========================================================== */

    function loadImage(src) {

      return new Promise(
        (resolve, reject) => {

          if (!src) {

            resolve(null);

            return;

          }


          const img =
            new Image();


          img.onload = () =>
            resolve(img);


          img.onerror =
            reject;


          img.src = src;

        }
      );

    }


    /* =========================================================
       FRAME LIST
    ========================================================== */

    function renderFrames() {

      const container =
        document.getElementById(
          'frame-list'
        );


      const filteredFrames =
        frames.filter(
          f =>
            f.shots ===
            targetShotCount
        );


      if (
        filteredFrames.length === 0
      ) {

        container.innerHTML = `

          <p class="col-span-2 text-stone-500 py-8">

            ไม่พบกรอบรูปสำหรับ
            ${targetShotCount}
            ช็อต

          </p>

        `;

        return;

      }


      const aspectClass =
        targetShotCount === 1
          ? 'aspect-[80/130]'
          : 'aspect-[70/210]';


      container.innerHTML =
        filteredFrames
          .map(f => `

            <div
              onclick="selectFrame('${f.file}')"
              class="group border border-stone-200 p-3 rounded-xl cursor-pointer hover:border-stone-800 bg-white shadow-sm hover:shadow-md transition flex flex-col items-center space-y-2">

              <div
                class="w-full ${aspectClass} bg-stone-100 rounded-lg overflow-hidden flex items-center justify-center p-1 border border-stone-100 relative">

                <img
                  src="${f.file}"
                  alt="${f.name}"
                  class="w-full h-full object-contain group-hover:scale-105 transition duration-200 z-10"
                  onerror="this.style.display='none'">

              </div>

              <p
                class="text-sm font-medium text-stone-700 group-hover:text-stone-900">

                ${f.name}

              </p>

            </div>

          `)
          .join('');

    }


    function selectFrame(file) {

      selectedFrame = file;

      goToStep(3);

    }


    /* =========================================================
       FLOYD STEINBERG DITHERING
       
       หัวใจสำคัญของการแก้ปัญหารูปดำสนิท
    ========================================================== */

    function applyThermalDither(
      sourceCanvas,
      brightness = 10,
      contrast = 1.05
    ) {

      const width =
        sourceCanvas.width;

      const height =
        sourceCanvas.height;


      const srcCtx =
        sourceCanvas.getContext(
          '2d',
          {
            willReadFrequently: true
          }
        );


      const imageData =
        srcCtx.getImageData(
          0,
          0,
          width,
          height
        );


      const data =
        imageData.data;


      /*
       * เก็บ grayscale
       */

      const gray =
        new Float32Array(
          width * height
        );


      for (
        let y = 0;
        y < height;
        y++
      ) {

        for (
          let x = 0;
          x < width;
          x++
        ) {

          const i =
            (y * width + x) * 4;


          /*
           * Luminance
           *
           * ใช้สูตรมาตรฐาน
           * เพื่อให้ผิวหนังไม่ดำเกินไป
           */

          let g =
            data[i] * 0.299 +
            data[i + 1] * 0.587 +
            data[i + 2] * 0.114;


          /*
           * Brightness
           */

          g += brightness;


          /*
           * Contrast
           */

          g =
            ((g - 128) * contrast) +
            128;


          /*
           * จำกัด 0-255
           */

          g =
            Math.max(
              0,
              Math.min(
                255,
                g
              )
            );


          gray[
            y * width + x
          ] = g;

        }

      }


      /*
       * Floyd-Steinberg
       */

      for (
        let y = 0;
        y < height;
        y++
      ) {

        for (
          let x = 0;
          x < width;
          x++
        ) {

          const index =
            y * width + x;


          const oldPixel =
            gray[index];


          const newPixel =
            oldPixel < 128
              ? 0
              : 255;


          const error =
            oldPixel - newPixel;


          gray[index] =
            newPixel;


          /*
           * กระจาย Error
           */

          if (
            x + 1 < width
          ) {

            gray[index + 1] +=
              error * 7 / 16;

          }


          if (
            x - 1 >= 0 &&
            y + 1 < height
          ) {

            gray[
              index + width - 1
            ] +=
              error * 3 / 16;

          }


          if (
            y + 1 < height
          ) {

            gray[
              index + width
            ] +=
              error * 5 / 16;

          }


          if (
            x + 1 < width &&
            y + 1 < height
          ) {

            gray[
              index + width + 1
            ] +=
              error * 1 / 16;

          }

        }

      }


      /*
       * สร้าง Canvas ใหม่
       */

      const output =
        document.createElement(
          'canvas'
        );


      output.width = width;

      output.height = height;


      const outCtx =
        output.getContext(
          '2d'
        );


      const outputData =
        outCtx.createImageData(
          width,
          height
        );


      for (
        let i = 0;
        i < gray.length;
        i++
      ) {

        const value =
          gray[i] < 128
            ? 0
            : 255;


        const p =
          i * 4;


        outputData.data[p] =
          value;

        outputData.data[p + 1] =
          value;

        outputData.data[p + 2] =
          value;

        outputData.data[p + 3] =
          255;

      }


      outCtx.putImageData(
        outputData,
        0,
        0
      );


      return output;

    }


    /* =========================================================
       RENDER FINAL CANVAS
    ========================================================== */

    async function renderFinalCanvas() {

      const canvas =
        document.getElementById(
          'final-canvas'
        );


      /*
       * ======================================================
       * 1 SHOT
       * ======================================================
       */

      if (
        targetShotCount === 1
      ) {

        /*
         * 80 x 130 mm
         *
         * ใช้ขนาดประมาณ 203 DPI
         */

        canvas.width = 640;

        canvas.height = 1040;


        const ctx =
          canvas.getContext(
            '2d'
          );


        /*
         * พื้นขาว
         */

        ctx.fillStyle =
          '#FFFFFF';

        ctx.fillRect(
          0,
          0,
          canvas.width,
          canvas.height
        );


        try {

          const shotImages =
            await Promise.all(
              capturedImages.map(
                imgSrc =>
                  loadImage(imgSrc)
              )
            );


          if (shotImages[0]) {

            const photoW = 560;

            const photoH = 720;

            const photoX = 40;

            const photoY = 80;


            ctx.drawImage(

              shotImages[0],

              photoX,
              photoY,

              photoW,
              photoH

            );

          }


          /*
           * Frame อยู่ด้านบนสุด
           */

          if (selectedFrame) {

            const frameImg =
              await loadImage(
                selectedFrame
              );


            if (frameImg) {

              ctx.drawImage(

                frameImg,

                0,
                0,

                canvas.width,
                canvas.height

              );

            }

          }

        } catch (err) {

          console.error(
            "สร้างภาพ 1 ช็อตผิดพลาด",
            err
          );

        }


      }

      /*
       * ======================================================
       * 3 SHOTS
       * ======================================================
       */

      else {

        /*
         * 70 x 210 mm
         *
         * ประมาณ 203 DPI
         */

        canvas.width = 560;

        canvas.height = 1680;


        const ctx =
          canvas.getContext(
            '2d'
          );


        ctx.fillStyle =
          '#FFFFFF';


        ctx.fillRect(
          0,
          0,
          canvas.width,
          canvas.height
        );


        try {

          const shotImages =
            await Promise.all(
              capturedImages.map(
                imgSrc =>
                  loadImage(imgSrc)
              )
            );


          /*
           * ขนาดรูปแต่ละใบ
           */

          const photoW = 480;

          const photoH = 360;

          const photoX = 40;


          /*
           * ตำแหน่งรูป
           */

          const topYs = [

            200,

            640,

            1080

          ];


          shotImages.forEach(
            (img, i) => {

              if (!img) {
                return;
              }


              ctx.drawImage(

                img,

                photoX,

                topYs[i],

                photoW,

                photoH

              );

            }
          );


          /*
           * Frame
           */

          if (selectedFrame) {

            const frameImg =
              await loadImage(
                selectedFrame
              );


            if (frameImg) {

              ctx.drawImage(

                frameImg,

                0,
                0,

                canvas.width,
                canvas.height

              );

            }

          }

        } catch (err) {

          console.error(
            "สร้างภาพ 3 ช็อตผิดพลาด",
            err
          );

        }

      }


      /*
       * ======================================================
       * THERMAL DITHER
       * ======================================================
       *
       * ต้องทำหลังจากรวม:
       *
       * รูป + Frame + Text
       *
       * เสร็จแล้ว
       */

      const dithered =
        applyThermalDither(

          canvas,

          THERMAL_BRIGHTNESS,

          THERMAL_CONTRAST

        );


      /*
       * ใส่กลับเข้า final canvas
       */

      canvas.width =
        dithered.width;

      canvas.height =
        dithered.height;


      const finalCtx =
        canvas.getContext(
          '2d'
        );


      finalCtx.drawImage(
        dithered,
        0,
        0
      );


      console.log(
        'Thermal Canvas:',
        canvas.width,
        'x',
        canvas.height
      );

    }


    /* =========================================================
       THERMAL SETTINGS
    ========================================================== */

    function updateThermalSettings() {

      THERMAL_BRIGHTNESS =
        parseInt(
          document.getElementById(
            'brightness'
          ).value
        );


      THERMAL_CONTRAST =
        parseFloat(
          document.getElementById(
            'contrast'
          ).value
        );


      document
        .getElementById(
          'brightness-value'
        )
        .innerText =
        THERMAL_BRIGHTNESS;


      document
        .getElementById(
          'contrast-value'
        )
        .innerText =
        THERMAL_CONTRAST.toFixed(2);


      /*
       * ยังไม่ต้องสร้างใหม่ทุกครั้ง
       * เพื่อไม่ให้เครื่องทำงานหนัก
       *
       * ผู้ใช้กด "ปรับภาพใหม่"
       */

    }


    /* =========================================================
       PRINT COPIES
    ========================================================== */

    function adjustCopies(delta) {

      const input =
        document.getElementById(
          'print-copies'
        );


      let val =
        parseInt(input.value) || 1;


      val =
        Math.max(
          1,
          Math.min(
            10,
            val + delta
          )
        );


      input.value = val;

    }


    /* =========================================================
       PRINT
    ========================================================== */

    function triggerPrint() {

      const copies =
        parseInt(
          document.getElementById(
            'print-copies'
          ).value
        ) || 1;


      /*
       * กันกรณีผู้ใช้ยังไม่ได้สร้างภาพใหม่
       */

      if (
        !document.getElementById(
          'final-canvas'
        ).width
      ) {

        alert(
          'กรุณารอสักครู่เพื่อสร้างรูปก่อนพิมพ์'
        );

        return;

      }


      /*
       * Browser print
       */

      if (copies === 1) {

        window.print();

        return;

      }


      /*
       * สำหรับหลายสำเนา
       *
       * เปิด Print dialog หลายครั้ง
       *
       * หมายเหตุ:
       * Browser อาจบล็อก dialog ถ้าเรียกเร็วเกินไป
       */

      let count = 0;


      function printNext() {

        if (count >= copies) {

          return;

        }


        count++;


        window.print();


        /*
         * รอเล็กน้อยก่อนเรียกครั้งต่อไป
         */

        setTimeout(
          printNext,
          1200
        );

      }


      printNext();

    }


    /* =========================================================
       DOWNLOAD IMAGE
    ========================================================== */

    async function downloadImage() {

      const canvas =
        document.getElementById(
          'final-canvas'
        );


      const dataUrl =
        canvas.toDataURL(
          'image/jpeg',
          0.95
        );


      try {

        const response =
          await fetch(dataUrl);


        const blob =
          await response.blob();


        const file =
          new File(

            [blob],

            `photobooth-${Date.now()}.jpg`,

            {
              type: 'image/jpeg'
            }

          );


        /*
         * Mobile / Safari
         */

        if (
          navigator.canShare &&
          navigator.canShare({
            files: [file]
          })
        ) {

          await navigator.share({

            files: [file],

            title:
              'Photo Booth',

            text:
              'รูปถ่ายจาก Photo Booth'

          });


        } else {

          /*
           * Desktop
           */

          const link =
            document.createElement(
              'a'
            );


          link.download =
            `photobooth-${Date.now()}.jpg`;


          link.href =
            dataUrl;


          link.click();

        }

      } catch (err) {

        console.error(
          'Save image failed:',
          err
        );

      }

    }

  </script>
