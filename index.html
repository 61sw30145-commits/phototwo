<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thermal Photo Booth - Dithering</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* ซ่อน UI ทั้งหมดเวลาสั่งพิมพ์ ออกเฉพาะพื้นที่ Canvas สด */
        @media print {
            body * {
                visibility: hidden;
            }
            #printArea, #printArea * {
                visibility: visible;
            }
            #printArea {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
            }
        }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col items-center p-6">

    <h1 class="text-2xl font-bold mb-4 text-emerald-400">Thermal Receipt Photo Booth</h1>

    <div class="flex flex-col md:flex-row gap-6 items-center justify-center w-full max-w-4xl">
        <!-- ฝั่งกล้อง Live View -->
        <div class="flex flex-col items-center bg-gray-800 p-4 rounded-xl shadow-lg">
            <h2 class="text-lg font-semibold mb-2">1. ส่องกล้อง / ถ่ายภาพ</h2>
            <video id="webcam" autoplay playsinline class="w-[320px] h-[240px] bg-black rounded-lg object-cover mb-4 scale-x-[-1]"></video>
            <button id="snapBtn" class="bg-emerald-500 hover:bg-emerald-600 text-black font-bold py-2 px-6 rounded-full shadow-md transition">
                📸 ถ่ายรูป
            </button>
        </div>

        <!-- ฝั่งพรีวิวรูปพิมพ์ (Dithered Output) -->
        <div class="flex flex-col items-center bg-gray-800 p-4 rounded-xl shadow-lg">
            <h2 class="text-lg font-semibold mb-2">2. พรีวิวภาพพิมพ์ (Dithered)</h2>
            <div id="printArea" class="bg-white p-2 rounded flex justify-center">
                <!-- ขนาด Canvas ตั้งไว้ที่ 384px (มาตรฐานหัวพิมพ์ 58mm / 203 DPI) -->
                <canvas id="photoCanvas" width="384" height="512" class="border border-gray-300"></canvas>
            </div>
            <button id="printBtn" class="mt-4 bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-6 rounded-full shadow-md transition">
                🖨️ สั่งพิมพ์ (Print)
            </button>
        </div>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('photoCanvas');
        const ctx = canvas.getContext('2d');
        const snapBtn = document.getElementById('snapBtn');
        const printBtn = document.getElementById('printBtn');

        // 1. เปิดใช้งาน Web Camera
        navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 }, audio: false })
            .then((stream) => {
                video.srcObject = stream;
            })
            .catch((err) => {
                console.error("ไม่สามารถเข้าถึงกล้องได้: ", err);
                alert("กรุณายินยอมให้เข้าถึงกล้องถ่ายรูป");
            });

        // 2. เมื่อกดปุ่มถ่ายรูป
        snapBtn.addEventListener('click', () => {
            // วาดรูปจาก Video ลง Canvas (กลับกระจกให้ตรงกับมุมมองคนถ่าย)
            ctx.save();
            ctx.scale(-1, 1);
            ctx.drawImage(video, -canvas.width, 0, canvas.width, canvas.height);
            ctx.restore();

            // ประมวลผลภาพด้วย Floyd-Steinberg Dithering
            applyFloydSteinbergDithering(ctx, canvas.width, canvas.height);
        });

        // 3. อัลกอริทึม Floyd-Steinberg Dithering
        function applyFloydSteinbergDithering(context, width, height) {
            const imgData = context.getImageData(0, 0, width, height);
            const data = imgData.data;

            // ขั้นตอนที่ 1: แปลงภาพเป็น Grayscale (สเกลเทา)
            for (let i = 0; i < data.length; i += 4) {
                const gray = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
                data[i] = gray;     // Red
                data[i + 1] = gray; // Green
                data[i + 2] = gray; // Blue
            }

            // ขั้นตอนที่ 2: คำนวณ Dithering กระจาย Error เพื่อสร้างเงาพิกเซล
            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    const idx = (y * width + x) * 4;
                    const oldPixel = data[idx];
                    
                    // ตัดสินใจเลือกสีดำ (0) หรือสีขาว (255)
                    const newPixel = oldPixel < 128 ? 0 : 255;
                    
                    data[idx] = newPixel;
                    data[idx + 1] = newPixel;
                    data[idx + 2] = newPixel;

                    const quantError = oldPixel - newPixel; // คำนวณส่วนต่างแสงเงา

                    // กระจายค่า Error ให้พิกเซลข้างเคียง
                    distributeError(data, width, height, x + 1, y, quantError * (7 / 16));
                    distributeError(data, width, height, x - 1, y + 1, quantError * (3 / 16));
                    distributeError(data, width, height, x, y + 1, quantError * (5 / 16));
                    distributeError(data, width, height, x + 1, y + 1, quantError * (1 / 16));
                }
            }

            // เขียนข้อมูลภาพที่ประมวลผลแล้วกลับลง Canvas
            context.putImageData(imgData, 0, 0);
        }

        // ฟังก์ชันช่วยกระจายค่า Error
        function distributeError(data, width, height, x, y, error) {
            if (x < 0 || x >= width || y < 0 || y >= height) return;
            const idx = (y * width + x) * 4;
            const val = data[idx] + error;
            const clampedVal = Math.max(0, Math.min(255, val));
            data[idx] = clampedVal;
            data[idx + 1] = clampedVal;
            data[idx + 2] = clampedVal;
        }

        // 4. สั่งพิมพ์ภาพ
        printBtn.addEventListener('click', () => {
            window.print();
        });
    </script>
</body>
</html>
